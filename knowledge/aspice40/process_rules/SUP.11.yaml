      {
        "id": "OUTCOME.5",
        "text": "5) A ML data management system including an ML data lifecycle is established. A ML data quality approach is developed including ML data quality criteria. Collected ML data are processed for consistency with ML data requirements. ML data are verified against defined ML data quality criteria and updated as needed. ML data are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SUP.11.BP1: Establish an ML data management system. Establish an ML data management system which supports • ML data management activities, • relevant sources of ML data, • ML data life cycle including a status model, and • interfaces to affected parties. Note 1: Supported ML data management activities may include data collection, labeling/annotation, and structuring.",
        "title": "Establish an ML data management system. Establish an ML data management system which supports • ML data management activities, • relevant sources of ML data, • ML data life cycle including a status model, and • interfaces to affected parties. Note 1: Supported ML data management activities may include data collection, labeling/annotation, and structuring."
      },
      {
        "id": "BP2",
        "text": "SUP.11.BP2: Develop an ML data quality approach. Develop an approach to ensure that the quality of ML data is analyzed based on defined ML data quality criteria and activities are performed to support avoidance of biases of data. Note 2: Examples of ML data quality criteria are relevant data sources, reliability and consistency of labelling, completeness against ML data requirements. Note 3: The ML data management system should support the quality criteria and activities of the ML data quality approach. Note 4: Biases to avoid may include sampling bias (e.g., gender, age) and feedback loop bias. Note 5: For creation of ML data sets see MLE.3.BP2 and MLE.4.BP2.",
        "title": "Develop an ML data quality approach. Develop an approach to ensure that the quality of ML data is analyzed based on defined ML data quality criteria and activities are performed to support avoidance of biases of data. Note 2: Examples of ML data quality criteria are relevant data sources, reliability and consistency of labelling, completeness against ML data requirements. Note 3: The ML data management system should support the quality criteria and activities of the ML data quality approach. Note 4: Biases to avoid may include sampling bias (e.g., gender, age) and feedback loop bias. Note 5: For creation of ML data sets see MLE.3.BP2 and MLE.4.BP2."
      },
      {
        "id": "BP3",
        "text": "SUP.11.BP3: Collect ML data. Relevant sources for raw data are identified and continuously monitored for changes. The raw data is collected according to the ML data requirements. Note 6: The identification and collection of ML data might be an organizational responsibility. Note 7: Continuous monitoring should include the ODD and may lead to changes of the ML requirements.",
        "title": "Collect ML data. Relevant sources for raw data are identified and continuously monitored for changes. The raw data is collected according to the ML data requirements. Note 6: The identification and collection of ML data might be an organizational responsibility. Note 7: Continuous monitoring should include the ODD and may lead to changes of the ML requirements."
      },
      {
        "id": "BP4",
        "text": "SUP.11.BP4: Process ML data. The raw data are processed (annotated, analyzed, and structured) according to the ML data requirements.",
        "title": "Process ML data. The raw data are processed (annotated, analyzed, and structured) according to the ML data requirements."
      },
      {
        "id": "BP5",
        "text": "SUP.11.BP5: Assure quality of ML data. Perform the activities according to the ML data quality approach to ensure that the ML data meets the defined ML data quality criteria. Note 8: These activities may include sample-based reviews or statistical methods. Outcome 4 X X Outcome 5 Outcome 3 Outcome 2 SUP.11 Machine Learning Data Management Outcome 1",
        "title": "Assure quality of ML data. Perform the activities according to the ML data quality approach to ensure that the ML data meets the defined ML data quality criteria. Note 8: These activities may include sample-based reviews or statistical methods. Outcome 4 X X Outcome 5 Outcome 3 Outcome 2 SUP.11 Machine Learning Data Management Outcome 1"
      },
      {
        "id": "BP6",
        "text": "SUP.11.BP6: Communicate agreed processed ML data. Inform all affected parties about the agreed processed ML data and provide them to the affected parties. Output Information Items 16-52 ML data management system X 19-50 ML data quality approach X 03-53 ML data 13-52 Communication evidence X Base Practices BP1: Establish an ML data management system BP2: Develop an ML data quality approach X BP3: Collect ML data X BP4: Process ML data X BP5: Assure quality of ML data X X BP6: Communicate agreed processed ML data X 4.9. Management process group (MAN)",
        "title": "Communicate agreed processed ML data. Inform all affected parties about the agreed processed ML data and provide them to the affected parties. Output Information Items 16-52 ML data management system X 19-50 ML data quality approach X 03-53 ML data 13-52 Communication evidence X Base Practices BP1: Establish an ML data management system BP2: Develop an ML data quality approach X BP3: Collect ML data X BP4: Process ML data X BP5: Assure quality of ML data X X BP6: Communicate agreed processed ML data X 4.9. Management process group (MAN)"
      }
