  "pam": {
    "purpose": "The purpose is to track and assess the performance of an external contract-based supplier company against agreed commitments.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Joint activities, as agreed between the customer and the supplier, are performed."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) All information, agreed upon for exchange, is communicated regularly between the customer and the supplier."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Performance of the supplier is monitored against the agreements."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Changes to the agreement, if needed, are negotiated between the customer and the supplier and documented in the agreement."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "ACQ.4.BP1: Agree on and maintain joint activities, joint interfaces, and information to be exchanged. Establish and maintain an agreement on information to be exchanged, on joint activities, joint interfaces, responsibilities, type and frequency of joint activities, communications, meetings, status reports, and reviews.",
        "title": "Agree on and maintain joint activities, joint interfaces, and information to be exchanged. Establish and maintain an agreement on information to be exchanged, on joint activities, joint interfaces, responsibilities, type and frequency of joint activities, communications, meetings, status reports, and reviews."
      },
      {
        "id": "BP2",
        "text": "ACQ.4.BP2: Exchange all agreed information. Use the defined joint interfaces between customer and supplier for the exchange of all agreed information.",
        "title": "Exchange all agreed information. Use the defined joint interfaces between customer and supplier for the exchange of all agreed information."
      },
      {
        "id": "BP3",
        "text": "ACQ.4.BP3: Review development work products with the supplier. Review development work products with the supplier on the agreed regular basis, covering technical aspects, problems and risks. Track open measures. Note 1: see SUP.9 for management of problems",
        "title": "Review development work products with the supplier. Review development work products with the supplier on the agreed regular basis, covering technical aspects, problems and risks. Track open measures. Note 1: see SUP.9 for management of problems"
      },
      {
        "id": "BP4",
        "text": "ACQ.4.BP4: Review progress of the supplier. Review progress of the supplier regarding schedule, quality, and cost on the agreed regular basis. Track open measures to closure and perform risk mitigation activities. Note 2: see MAN.5 for management of risks",
        "title": "Review progress of the supplier. Review progress of the supplier regarding schedule, quality, and cost on the agreed regular basis. Track open measures to closure and perform risk mitigation activities. Note 2: see MAN.5 for management of risks"
      },
      {
        "id": "BP5",
        "text": "ACQ.4.BP5: Act to correct deviations. Take action when agreed objectives are not achieved. Negotiate changes to objectives and document them in the agreements. Outcome 1 Outcome 2 Outcome 3 Outcome 4 02-01 Commitment/Agreement X X X X 13-52 Communication evidence X X X 13-09 Meeting support evidence X X ACQ.4 Supplier Monitoring Output Information Items 13-14 Progress status X X 13-16 Change request X 13-19 Review evidence X 14-02 Corrective action X 15-51 Analysis results X Base Practices BP1: Agree on and maintain joint processes, joint interfaces, and information to be exchanged X X BP2: Exchange all agreed information X X BP3: Review development work products with the supplier X X X BP4: Review progress of the supplier X X X X X BP5: Act to correct deviations X X 4.2. Supply process group (SPL)",
        "title": "Act to correct deviations. Take action when agreed objectives are not achieved. Negotiate changes to objectives and document them in the agreements. Outcome 1 Outcome 2 Outcome 3 Outcome 4 02-01 Commitment/Agreement X X X X 13-52 Communication evidence X X X 13-09 Meeting support evidence X X ACQ.4 Supplier Monitoring Output Information Items 13-14 Progress status X X 13-16 Change request X 13-19 Review evidence X 14-02 Corrective action X 15-51 Analysis results X Base Practices BP1: Agree on and maintain joint processes, joint interfaces, and information to be exchanged X X BP2: Exchange all agreed information X X BP3: Review development work products with the supplier X X X BP4: Review progress of the supplier X X X X X BP5: Act to correct deviations X X 4.2. Supply process group (SPL)"
