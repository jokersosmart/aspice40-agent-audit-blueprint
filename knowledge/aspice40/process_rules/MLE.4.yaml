      {
        "id": "OUTCOME.5",
        "text": "5) A ML test approach is defined. A ML test data set is created. The trained ML model is tested. The deployed ML model is derived from the trained ML model and tested. Consistency and bidirectional traceability are established between the ML test approach and the ML requirements, and the ML test data set and the ML data requirements; and bidirectional traceability is established between the ML test approach and ML test results."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Results of the ML model testing are summarized and communicated with the deployed ML model to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MLE.4.BP1: Specify an ML test approach. Specify an ML test approach suitable to provide evidence for compliance of the trained ML model and the deployed ML model with the ML requirements. The ML test approach includes • ML test scenarios with distribution of data characteristics (e.g., gender, weather conditions, street conditions within the ODD) defined by ML requirements, • distribution and frequency of each ML test scenario inside the ML test data set, • expected test result per test datum, • entry and exit criteria of the testing, • approach for data set creation and modification, and • the required testing infrastructure and environment setup. Note 1: Expected test result per test datum might require labeling of test data to support comparison of output of the ML model with the expected output. Note 2: Test datum is the smallest amount of data which is processed by the ML model into only one output. E.g., one image in photo processing or an audio sequence in voice recognition. Note 3: Data characteristic is one property of the data that may have different expressions in the ODD. E.g., weather condition may contain expressions like sunny, foggy or rainy. Note 4: An ML test scenario is a combination of expressions of all defined data characteristics e.g., weather conditions = sunny, street conditions = gravel road.",
        "title": "Specify an ML test approach. Specify an ML test approach suitable to provide evidence for compliance of the trained ML model and the deployed ML model with the ML requirements. The ML test approach includes • ML test scenarios with distribution of data characteristics (e.g., gender, weather conditions, street conditions within the ODD) defined by ML requirements, • distribution and frequency of each ML test scenario inside the ML test data set, • expected test result per test datum, • entry and exit criteria of the testing, • approach for data set creation and modification, and • the required testing infrastructure and environment setup. Note 1: Expected test result per test datum might require labeling of test data to support comparison of output of the ML model with the expected output. Note 2: Test datum is the smallest amount of data which is processed by the ML model into only one output. E.g., one image in photo processing or an audio sequence in voice recognition. Note 3: Data characteristic is one property of the data that may have different expressions in the ODD. E.g., weather condition may contain expressions like sunny, foggy or rainy. Note 4: An ML test scenario is a combination of expressions of all defined data characteristics e.g., weather conditions = sunny, street conditions = gravel road."
      },
      {
        "id": "BP2",
        "text": "MLE.4.BP2: Create ML test data set. Create the ML test data set needed for testing of the trained ML model and testing of the deployed ML model from the ML data collection provided by SUP.11 considering the ML test approach. The ML test data set shall not be used for training. Note 5: The ML test data set for the trained ML model might differ from the test data set of the deployed ML model. Note 6: Additional data sets might be used for special purposes like assurance of safety, fairness, robustness.",
        "title": "Create ML test data set. Create the ML test data set needed for testing of the trained ML model and testing of the deployed ML model from the ML data collection provided by SUP.11 considering the ML test approach. The ML test data set shall not be used for training. Note 5: The ML test data set for the trained ML model might differ from the test data set of the deployed ML model. Note 6: Additional data sets might be used for special purposes like assurance of safety, fairness, robustness."
      },
      {
        "id": "BP3",
        "text": "MLE.4.BP3: Test trained ML model. Test the trained ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results. Note 7: Evaluation of test logs might include pattern analysis of failed test data to support e.g., trustworthiness.",
        "title": "Test trained ML model. Test the trained ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results. Note 7: Evaluation of test logs might include pattern analysis of failed test data to support e.g., trustworthiness."
      },
      {
        "id": "BP4",
        "text": "MLE.4.BP4: Derive deployed ML model. Derive the deployed ML model from the trained ML model according to the ML architecture. The deployed ML model shall be used for testing and delivery to software integration. Note 8: The deployed ML model will be integrated into the target system and may differ from the trained ML model which often requires powerful hardware and uses interpretative languages. MLE4.BP5: Test deployed ML model. Test the deployed ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results.",
        "title": "Derive deployed ML model. Derive the deployed ML model from the trained ML model according to the ML architecture. The deployed ML model shall be used for testing and delivery to software integration. Note 8: The deployed ML model will be integrated into the target system and may differ from the trained ML model which often requires powerful hardware and uses interpretative languages. MLE4.BP5: Test deployed ML model. Test the deployed ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results."
      },
      {
        "id": "BP6",
        "text": "MLE.4.BP6: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML test approach and the ML requirements, and the ML test data set and the ML data requirements; and bidirectional traceability is established between the ML test approach and ML test results. Note 9: Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. X Outcome 6 Outcome 4 X Outcome 5 Outcome 3 MLE.4 Machine Learning Model Testing Outcome 2 Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML test approach and the ML requirements, and the ML test data set and the ML data requirements; and bidirectional traceability is established between the ML test approach and ML test results. Note 9: Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. X Outcome 6 Outcome 4 X Outcome 5 Outcome 3 MLE.4 Machine Learning Model Testing Outcome 2 Outcome 1"
      },
      {
        "id": "BP7",
        "text": "MLE.4.BP7: Summarize and communicate results. Summarize the ML test results of the ML model. Inform all affected parties about the agreed results and the deployed ML model. Output Information Items 08-64 ML test approach X 03-51 ML data set X 13-50 ML test results 11-50 Deployed ML model X 13-51 Consistency evidence X 13-52 Communication evidence X Base Practices BP1: Specify an ML test approach X BP2: Create ML test data set X BP3: Test trained ML model X BP4: Derive deployed ML model X BP5: Test deployed ML model X BP6: Ensure consistency and establish bidirectional traceability X BP7: Summarize and communicate results X 4.7. Hardware Engineering process group (HWE)",
