        "id": "OUTCOME.5",
        "text": "5) The contents of the product releases are determined. The release package is assembled from configured items. The release documentation is defined and produced. Release approval is performed against defined criteria. The release package is made available to the intended customer."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SPL.2.BP1: Define the functional content of releases. Define the functionality to be included and the release criteria for each release. Note 1: This may include the hardware elements, software elements, and extra application parameter files (influencing the identified system functionality) that are needed for the release.",
        "title": "Define the functional content of releases. Define the functionality to be included and the release criteria for each release. Note 1: This may include the hardware elements, software elements, and extra application parameter files (influencing the identified system functionality) that are needed for the release."
      },
      {
        "id": "BP2",
        "text": "SPL.2.BP2: Define release package. Define the release as well as supporting tools and information. Note 2: The release package may include also programming tools.",
        "title": "Define release package. Define the release as well as supporting tools and information. Note 2: The release package may include also programming tools."
      },
      {
        "id": "BP3",
        "text": "SPL.2.BP3: Ensure unique identification of releases. Ensure a unique identification of the release based upon the intended purpose and expectations of the release. Note 3: Unique identification may be realized by a classification and numbering scheme for product releases.",
        "title": "Ensure unique identification of releases. Ensure a unique identification of the release based upon the intended purpose and expectations of the release. Note 3: Unique identification may be realized by a classification and numbering scheme for product releases."
      },
      {
        "id": "BP4",
        "text": "SPL.2.BP4: Build the release from items under configuration control. Build the release from items under configuration control to ensure integrity. Note 4: This practice may be supported by the SUP.8 Configuration Management Process.",
        "title": "Build the release from items under configuration control. Build the release from items under configuration control to ensure integrity. Note 4: This practice may be supported by the SUP.8 Configuration Management Process."
      },
      {
        "id": "BP5",
        "text": "SPL.2.BP5: Ensure release approval before delivery. Criteria for the release are satisfied before delivery takes place.",
        "title": "Ensure release approval before delivery. Criteria for the release are satisfied before delivery takes place."
      },
      {
        "id": "BP6",
        "text": "SPL.2.BP6: Provide a release note. A release is accompanied by information detailing key characteristics of the release. Note 5: The release note may include information about legal aspects like relevant target markets, legislation that is considered etc. See also VAL.1 Validation. SPL2.BP7: Communicate the type, service level and duration of support for a release. Identify and communicate the type, service level and duration of support for a release.",
        "title": "Provide a release note. A release is accompanied by information detailing key characteristics of the release. Note 5: The release note may include information about legal aspects like relevant target markets, legislation that is considered etc. See also VAL.1 Validation. SPL2.BP7: Communicate the type, service level and duration of support for a release. Identify and communicate the type, service level and duration of support for a release."
      },
      {
