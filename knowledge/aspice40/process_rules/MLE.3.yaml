  "pam": {
    "purpose": "The purpose is to optimize the ML model to meet the defined ML requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A ML training and validation approach is specified."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) The data set for ML training and ML validation is created."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) The ML model, including hyperparameter values, is optimized to meet the defined ML requirements."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between the ML training and validation data set and the ML data requirements."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Results of optimization are summarized, and the trained ML model is agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MLE.3.BP1: Specify ML training and validation approach. Specify an approach which supports the training and validation of the ML model to meet the defined ML requirements. The ML training and validation approach includes • entry and exit criteria of the training and validation, • approaches for hyperparameter tuning / optimization, • approach for data set creation and modification, and • training and validation environment Note 1: The ML training and validation approach may include random dropout and other robustification methods. Note 2: ML validation is the optimization of the hyperparameters during Machine Learning Training (MLE.3). The term “validation” has a different meaning than VAL.1. Note 3: The training environment should reflect the environment of the deployed model.",
        "title": "Specify ML training and validation approach. Specify an approach which supports the training and validation of the ML model to meet the defined ML requirements. The ML training and validation approach includes • entry and exit criteria of the training and validation, • approaches for hyperparameter tuning / optimization, • approach for data set creation and modification, and • training and validation environment Note 1: The ML training and validation approach may include random dropout and other robustification methods. Note 2: ML validation is the optimization of the hyperparameters during Machine Learning Training (MLE.3). The term “validation” has a different meaning than VAL.1. Note 3: The training environment should reflect the environment of the deployed model."
      },
      {
        "id": "BP2",
        "text": "MLE.3.BP2: Create ML training and validation data set. Select data from the ML data collection provided by SUP.11 and assign them to the data set for training and validation of the ML model according to the specified ML training and validation approach. Note 4: The ML training and validation data set may include corner cases, unexpected cases, and normal cases depending on the ML requirements. Note 5: A separated data set for training and validation might not be required in some cases (e.g., kfold cross validation, no optimization of hyperparameters).",
        "title": "Create ML training and validation data set. Select data from the ML data collection provided by SUP.11 and assign them to the data set for training and validation of the ML model according to the specified ML training and validation approach. Note 4: The ML training and validation data set may include corner cases, unexpected cases, and normal cases depending on the ML requirements. Note 5: A separated data set for training and validation might not be required in some cases (e.g., kfold cross validation, no optimization of hyperparameters)."
      },
      {
        "id": "BP3",
        "text": "MLE.3.BP3: Create and optimize ML model. Create the ML model according to the ML architecture and train it, using the identified ML training and validation data set according to the ML training and validation approach to meet the defined ML requirements, and training and validation exit criteria.",
        "title": "Create and optimize ML model. Create the ML model according to the ML architecture and train it, using the identified ML training and validation data set according to the ML training and validation approach to meet the defined ML requirements, and training and validation exit criteria."
      },
      {
        "id": "BP4",
        "text": "MLE.3.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML training and validation data set and the ML data requirements. Note 6: Bidirectional traceability supports consistency and facilitates impact analyses of change requests. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 5 Outcome 4 Outcome 3 MLE.3 Machine Learning Training Outcome 2 Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML training and validation data set and the ML data requirements. Note 6: Bidirectional traceability supports consistency and facilitates impact analyses of change requests. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 5 Outcome 4 Outcome 3 MLE.3 Machine Learning Training Outcome 2 Outcome 1"
      },
      {
        "id": "BP5",
        "text": "MLE.3.BP5: Summarize and communicate agreed trained ML model. Summarize the results of the optimization and inform all affected parties about the agreed trained ML model. Output Information Items 08-65 ML training and validation approach X 03-51 ML data set X 01-53 Trained ML model X 01-54 Hyperparameter X 13-51 Consistency evidence X 13-52 Communication evidence X Base Practices BP1: Specify ML training and validation approach BP2: Create ML training and validation data set BP3: Create and optimize ML model X X BP4: Ensure consistency and establish bidirectional traceability X X BP5: Summarize and communicate agreed trained ML model X",
        "title": "Summarize and communicate agreed trained ML model. Summarize the results of the optimization and inform all affected parties about the agreed trained ML model. Output Information Items 08-65 ML training and validation approach X 03-51 ML data set X 01-53 Trained ML model X 01-54 Hyperparameter X 13-51 Consistency evidence X 13-52 Communication evidence X Base Practices BP1: Specify ML training and validation approach BP2: Create ML training and validation data set BP3: Create and optimize ML model X X BP4: Ensure consistency and establish bidirectional traceability X X BP5: Summarize and communicate agreed trained ML model X"
      }
    ]
