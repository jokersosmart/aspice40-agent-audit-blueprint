  "pam": {
    "purpose": "The purpose of the Software Verification process is to ensure that the integrated software is verified to be consistent with the software requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures are specified for software verification of the software based on the software requirements."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Verification measures are selected according to the release scope considering criteria, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) The integrated software is verified using the selected verification measures and the results of software verification are recorded."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between verification measures and software requirements; and bidirectional traceability is established between verification results and verification measures."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Results of the software verification are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SWE.6.BP1: Specify verification measures for software verification. Specify the verification measures for software verification suitable to provide evidence for compliance of the integrated software with the functional and non-functional information in the software requirements, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification measures, and • the required verification infrastructure and environment setup. Note 1: The selection of appropriate techniques for verification measures may depend on the content of the respective software requirement (e.g, boundary values and equivalence classes for data range-oriented requirements, positive/sunny-day-test vs. negative testing such as fault injection), or on requirements-based testing vs. “error guessing based on knowledge or experience”.",
        "title": "Specify verification measures for software verification. Specify the verification measures for software verification suitable to provide evidence for compliance of the integrated software with the functional and non-functional information in the software requirements, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification measures, and • the required verification infrastructure and environment setup. Note 1: The selection of appropriate techniques for verification measures may depend on the content of the respective software requirement (e.g, boundary values and equivalence classes for data range-oriented requirements, positive/sunny-day-test vs. negative testing such as fault injection), or on requirements-based testing vs. “error guessing based on knowledge or experience”."
      },
      {
        "id": "BP2",
        "text": "SWE.6.BP2: Select verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for selection criteria can be prioritization of requirements, continuous development, the need for regression verification (due to e.g., changes to the software requirements), or the intended use of the delivered product release (test bench, test track, public road etc.)",
        "title": "Select verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for selection criteria can be prioritization of requirements, continuous development, the need for regression verification (due to e.g., changes to the software requirements), or the intended use of the delivered product release (test bench, test track, public road etc.)"
      },
      {
        "id": "BP3",
        "text": "SWE.6.BP3: Verify the integrated software. Perform the verification of the integrated software using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling verification results that deviate from expected results.",
        "title": "Verify the integrated software. Perform the verification of the integrated software using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling verification results that deviate from expected results."
      },
      {
        "id": "BP4",
        "text": "SWE.6.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and software requirements. Establish bidirectional traceability between verification results and verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and software requirements. Establish bidirectional traceability between verification results and verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP5",
        "text": "SWE.6.BP5: Summarize and communicate results. Summarize the software verification results and communicate them to all affected parties. Outcome 5 Outcome 4 Outcome 3 SWE.6 Software Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify verification measures for software verification BP2: Select verification measures X BP3: Verify the integrated software X BP4: Ensure consistency and establish bidirectional traceability. X X BP5: Summarize and communicate results X 4.5. Validation process group (VAL)",
        "title": "Summarize and communicate results. Summarize the software verification results and communicate them to all affected parties. Outcome 5 Outcome 4 Outcome 3 SWE.6 Software Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify verification measures for software verification BP2: Select verification measures X BP3: Verify the integrated software X BP4: Ensure consistency and establish bidirectional traceability. X X BP5: Summarize and communicate results X 4.5. Validation process group (VAL)"
      }
    ]
