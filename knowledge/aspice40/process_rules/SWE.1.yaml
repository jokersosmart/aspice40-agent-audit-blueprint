      {
        "id": "OUTCOME.5",
        "text": "5) Software requirements are specified. Software requirements are structured and prioritized. Software requirements are analyzed for correctness and technical feasibility. The impact of software requirements on the operating environment is analyzed. Consistency and bidirectional traceability are established between software requirements and system requirements."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Consistency and bidirectional traceability are established between software requirements and system architecture."
      },
      {
        "id": "OUTCOME.7",
        "text": "7) The software requirements are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SWE.1.BP1: Specify software requirements. Use the system requirements and the system architecture to identify and document the functional and non-functional requirements for the software according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO 26262-8:2018, or the INCOSE Guide for Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by technical standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement). Note 3: In case of software-only development, the system requirements and the system architecture refer to a given operating environment. In that case, stakeholder requirements can be used as the basis for identifying the required functions and capabilities of the software. Note 4: The hardware-software-interface (HSI) definition puts in context hardware and therefore it is an interface decision at the system design level. If such a HSI exists, then it may provide input to software requirements.",
        "title": "Specify software requirements. Use the system requirements and the system architecture to identify and document the functional and non-functional requirements for the software according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO 26262-8:2018, or the INCOSE Guide for Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by technical standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement). Note 3: In case of software-only development, the system requirements and the system architecture refer to a given operating environment. In that case, stakeholder requirements can be used as the basis for identifying the required functions and capabilities of the software. Note 4: The hardware-software-interface (HSI) definition puts in context hardware and therefore it is an interface decision at the system design level. If such a HSI exists, then it may provide input to software requirements."
      },
      {
        "id": "BP2",
        "text": "SWE.1.BP2: Structure software requirements. Structure and prioritize the software requirements. Note 5: Examples for structuring criteria can be grouping (e.g., by functionality) or expressing product variants. Note 6: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1.",
        "title": "Structure software requirements. Structure and prioritize the software requirements. Note 5: Examples for structuring criteria can be grouping (e.g., by functionality) or expressing product variants. Note 6: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1."
      },
      {
        "id": "BP3",
        "text": "SWE.1.BP3: Analyze software requirements. Analyze the specified software requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 7: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 8: Technical feasibility can be evaluated based on e.g., platform or product line, or by prototyping.",
        "title": "Analyze software requirements. Analyze the specified software requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 7: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 8: Technical feasibility can be evaluated based on e.g., platform or product line, or by prototyping."
      },
      {
        "id": "BP4",
        "text": "SWE.1.BP4: Analyze the impact on the operating environment. Analyze the impact that the software requirements will have on elements in the operating environment.",
        "title": "Analyze the impact on the operating environment. Analyze the impact that the software requirements will have on elements in the operating environment."
      },
      {
        "id": "BP5",
        "text": "SWE.1.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between software requirements and system architecture. Ensure consistency and establish bidirectional traceability between software requirements and system requirements. Note 9: Redundant traceability is not intended. Note 10: There may be non-functional system requirements that the software requirements do not trace to. Examples are process requirements or requirements related to later software product lifecycle phases such as incident handling. Such requirements are still subject to verification. Note 11: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 12: In case of software development only, the system requirements and system architecture refer to a given operating environment. In that case, consistency and bidirectional traceability can be ensured between stakeholder requirements and software requirements. X X Outcome 7 X Outcome 6 X Outcome 5 X X Outcome 4 X Outcome 3 Output Information Items 17-00 Requirement 17-54 Requirement Attribute 15-51 Analysis Results 13-51 Consistency Evidence 13-52 Communication Evidence Outcome 2 SWE.1 Software Requirements Analysis Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between software requirements and system architecture. Ensure consistency and establish bidirectional traceability between software requirements and system requirements. Note 9: Redundant traceability is not intended. Note 10: There may be non-functional system requirements that the software requirements do not trace to. Examples are process requirements or requirements related to later software product lifecycle phases such as incident handling. Such requirements are still subject to verification. Note 11: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 12: In case of software development only, the system requirements and system architecture refer to a given operating environment. In that case, consistency and bidirectional traceability can be ensured between stakeholder requirements and software requirements. X X Outcome 7 X Outcome 6 X Outcome 5 X X Outcome 4 X Outcome 3 Output Information Items 17-00 Requirement 17-54 Requirement Attribute 15-51 Analysis Results 13-51 Consistency Evidence 13-52 Communication Evidence Outcome 2 SWE.1 Software Requirements Analysis Outcome 1"
      },
      {
        "id": "BP6",
        "text": "SWE.1.BP6: Communicate agreed software requirements and impact on the operating environment. Communicate the agreed software requirements, and the results of the analysis of impact on the operating environment, to all affected parties. X Base Practices BP1: Specify software requirements BP2: Structure software requirements BP3: Analyze software requirements BP4: Analyze the impact on the operating environment BP5: Ensure consistency and establish bidirectional traceability BP6: Communicate agreed software requirements and impact on the operating environment X X X X X X X",
        "title": "Communicate agreed software requirements and impact on the operating environment. Communicate the agreed software requirements, and the results of the analysis of impact on the operating environment, to all affected parties. X Base Practices BP1: Specify software requirements BP2: Structure software requirements BP3: Analyze software requirements BP4: Analyze the impact on the operating environment BP5: Ensure consistency and establish bidirectional traceability BP6: Communicate agreed software requirements and impact on the operating environment X X X X X X X"
      }
