      "verbatim_text": "SWE.1.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between software requirements and system architecture. Ensure consistency and establish bidirectional traceability between software requirements and system requirements. Note 9: Redundant traceability is not intended. Note 10: There may be non-functional system requirements that the software requirements do not trace to. Examples are process requirements or requirements related to later software product lifecycle phases such as incident handling. Such requirements are still subject to verification. Note 11: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 12: In case of software development only, the system requirements and system architecture refer to a given operating environment. In that case, consistency and bidirectional traceability can be ensured between stakeholder requirements and software requirements. X X Outcome 7 X Outcome 6 X Outcome 5 X X Outcome 4 X Outcome 3 Output Information Items 17-00 Requirement 17-54 Requirement Attribute 15-51 Analysis Results 13-51 Consistency Evidence 13-52 Communication Evidence Outcome 2 SWE.1 Software Requirements Analysis Outcome 1",
