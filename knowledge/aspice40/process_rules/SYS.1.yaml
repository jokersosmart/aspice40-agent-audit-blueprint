  "pam": {
    "purpose": "The purpose is to gather, analyze, and track evolving stakeholder needs and requirements throughout the lifecycle of the product and/or service to establish a set of agreed requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Continuing communication with the stakeholder is established."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Stakeholder expectations are understood, and requirements are defined and agreed."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Stakeholder requirements changes arising from stakeholder needs are analyzed to enable associated risk assessment and impact management."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Determination of stakeholder requirements status is ensured for all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SYS.1.BP1: Obtain stakeholder expectations and requests. Obtain and define stakeholder expectations and requests through direct solicitation of stakeholder input, and through review of stakeholder business proposals (where relevant) and other documents containing inputs to stakeholder requirements, and consideration of the target operating and hardware environment. Note 1: Documenting the stakeholder, or the source of a stakeholder requirement, supports stakeholder requirements agreement and change analysis (see BP2 and BP3).",
        "title": "Obtain stakeholder expectations and requests. Obtain and define stakeholder expectations and requests through direct solicitation of stakeholder input, and through review of stakeholder business proposals (where relevant) and other documents containing inputs to stakeholder requirements, and consideration of the target operating and hardware environment. Note 1: Documenting the stakeholder, or the source of a stakeholder requirement, supports stakeholder requirements agreement and change analysis (see BP2 and BP3)."
      },
      {
        "id": "BP2",
        "text": "SYS.1.BP2: Agree on requirements. Formalize the stakeholder’s expectations and requests into requirements. Reach a common understanding of the set of stakeholder requirements among affected parties by obtaining an explicit agreement from all affected parties. Note 2: Examples of affected parties are customers, suppliers, design partners, joint venture partners, or outsourcing parties. Note 3: The agreed stakeholder requirements may be based on feasibility studies and/or cost and schedule impact analysis.",
        "title": "Agree on requirements. Formalize the stakeholder’s expectations and requests into requirements. Reach a common understanding of the set of stakeholder requirements among affected parties by obtaining an explicit agreement from all affected parties. Note 2: Examples of affected parties are customers, suppliers, design partners, joint venture partners, or outsourcing parties. Note 3: The agreed stakeholder requirements may be based on feasibility studies and/or cost and schedule impact analysis."
      },
      {
        "id": "BP3",
        "text": "SYS.1.BP3: Analyze stakeholder requirements changes. Analyze all changes made to the stakeholder requirements against the agreed stakeholder requirements. Assess the impact and risks, and initiate appropriate change control and mitigation actions. Note 4: Requirements changes may arise from different sources as for instance changing technology, stakeholder needs, or legal constraints. Note 5: Refer to SUP.10 Change Request Management, if required. Outcome 4 Outcome 3 SYS.1 Requirements Elicitation Outcome 2 Outcome 1",
        "title": "Analyze stakeholder requirements changes. Analyze all changes made to the stakeholder requirements against the agreed stakeholder requirements. Assess the impact and risks, and initiate appropriate change control and mitigation actions. Note 4: Requirements changes may arise from different sources as for instance changing technology, stakeholder needs, or legal constraints. Note 5: Refer to SUP.10 Change Request Management, if required. Outcome 4 Outcome 3 SYS.1 Requirements Elicitation Outcome 2 Outcome 1"
      },
      {
        "id": "BP4",
        "text": "SYS.1.BP4: Communicate requirements status. Ensure all affected parties can be aware of the status and disposition of their requirements including changes and can communicate necessary information and data. Output Information Items 15-51 Analysis Results X 13-52 Communication Evidence X X 17-00 Requirement X 17-54 Requirement Attribute X X X Base Practices BP1: Obtain stakeholder expectations and requests X BP2: Agree on requirements X BP3: Analyze stakeholder requirements changes BP4: Communicate requirements status X X X",
        "title": "Communicate requirements status. Ensure all affected parties can be aware of the status and disposition of their requirements including changes and can communicate necessary information and data. Output Information Items 15-51 Analysis Results X 13-52 Communication Evidence X X 17-00 Requirement X 17-54 Requirement Attribute X X X Base Practices BP1: Obtain stakeholder expectations and requests X BP2: Agree on requirements X BP3: Analyze stakeholder requirements changes BP4: Communicate requirements status X X X"
      }
    ]
  },
