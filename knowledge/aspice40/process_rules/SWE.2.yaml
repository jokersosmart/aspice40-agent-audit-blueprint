  "pam": {
    "purpose": "The purpose is to establish an analyzed software architecture, comprising static and dynamic aspects, consistent with the software requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A software architecture is designed including static and dynamic aspects."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) The software architecture is analyzed against defined criteria."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Consistency and bidirectional traceability are established between software architecture and software requirements."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) The software architecture is agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SWE.2.BP1: Specify static aspects of the software architecture. Specify and document the static aspects of the software architecture with respect to the functional and non-functional software requirements, including external interfaces and a defined set of software components with their interfaces and relationships. Note 1: The hardware-software-interface (HSI) definition puts in context the hardware design and therefore is an aspect of system design (SYS.3).",
        "title": "Specify static aspects of the software architecture. Specify and document the static aspects of the software architecture with respect to the functional and non-functional software requirements, including external interfaces and a defined set of software components with their interfaces and relationships. Note 1: The hardware-software-interface (HSI) definition puts in context the hardware design and therefore is an aspect of system design (SYS.3)."
      },
      {
        "id": "BP2",
        "text": "SWE.2.BP2: Specify dynamic aspects of the software architecture. Specify and document the dynamic aspects of the software architecture with respect to the functional and nonfunctional software requirements, including the behavior of the software components and their interaction in different software modes, and concurrency aspects. Note 2: Examples for concurrency aspects are application-relevant interrupt handling, preemptive processing, multi-threading. Note 3: Examples for behavioral descriptions are natural language or semi-formal notation (e.g, SysML, UML).",
        "title": "Specify dynamic aspects of the software architecture. Specify and document the dynamic aspects of the software architecture with respect to the functional and nonfunctional software requirements, including the behavior of the software components and their interaction in different software modes, and concurrency aspects. Note 2: Examples for concurrency aspects are application-relevant interrupt handling, preemptive processing, multi-threading. Note 3: Examples for behavioral descriptions are natural language or semi-formal notation (e.g, SysML, UML)."
      },
      {
        "id": "BP3",
        "text": "SWE.2.BP3: Analyze software architecture. Analyze the software architecture regarding relevant technical design aspects and to support project management regarding project estimates. Document a rationale for the software architectural design decision. Note 4: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 5: The analysis may include the suitability of pre-existing software components for the current application. Note 6: Examples of methods suitable for analyzing technical aspects are prototypes, simulations, qualitative analyses. Note 7: Examples of technical aspects are functionality, timings, and resource consumption (e.g, ROM, RAM, external / internal EEPROM or Data Flash or CPU load). Note 8: Design rationales can include arguments such as proven-in-use, reuse of a software framework or software product line, a make-or-buy decision, or found in an evolutionary way (e.g, set-based design).",
        "title": "Analyze software architecture. Analyze the software architecture regarding relevant technical design aspects and to support project management regarding project estimates. Document a rationale for the software architectural design decision. Note 4: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 5: The analysis may include the suitability of pre-existing software components for the current application. Note 6: Examples of methods suitable for analyzing technical aspects are prototypes, simulations, qualitative analyses. Note 7: Examples of technical aspects are functionality, timings, and resource consumption (e.g, ROM, RAM, external / internal EEPROM or Data Flash or CPU load). Note 8: Design rationales can include arguments such as proven-in-use, reuse of a software framework or software product line, a make-or-buy decision, or found in an evolutionary way (e.g, set-based design)."
      },
      {
        "id": "BP4",
        "text": "SWE.2.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the software architecture and the software requirements. Note 9: There may be non-functional software requirements that the software architectural design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 10: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g, the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 4 Outcome 3 SWE.2 Software Architectural Design Outcome 2 Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the software architecture and the software requirements. Note 9: There may be non-functional software requirements that the software architectural design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 10: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g, the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 4 Outcome 3 SWE.2 Software Architectural Design Outcome 2 Outcome 1"
      },
      {
        "id": "BP5",
        "text": "SWE.2.BP5: Communicate agreed software architecture. Communicate the agreed software architecture to all affected parties. Output Information Items 04-04 Software Architecture X 13-51 Consistency Evidence X 13-52 Communication Evidence X 15-51 Analysis Results X Base Practices BP1: Specify static aspects of software architecture X BP2: Specify dynamic aspects of software architecture X BP3: Analyze software architecture X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed software architecture X",
        "title": "Communicate agreed software architecture. Communicate the agreed software architecture to all affected parties. Output Information Items 04-04 Software Architecture X 13-51 Consistency Evidence X 13-52 Communication Evidence X 15-51 Analysis Results X Base Practices BP1: Specify static aspects of software architecture X BP2: Specify dynamic aspects of software architecture X BP3: Analyze software architecture X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed software architecture X"
      }
