        "text": "4)"
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Problems are uniquely identified, recorded and classified. Problems are analyzed and assessed to determine an appropriate solution. Problem resolution is initiated. Problems are tracked to closure. The status of problems including trends identified are reported to stakeholders."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SUP.9.BP1: Identify and record the problem. Each problem is uniquely identified, described and recorded. A status is assigned to each problem to facilitate tracking. Supporting information is provided to reproduce and diagnose the problem. NOTE 1: Problems may relate to e.g., product, resources, or methods. NOTE 2: Example values for the problem status are “new”, “solved”, “closed”, etc. NOTE 3: Supporting information may include e.g, the origin of the problem, how it can be reproduced, environmental information, by whom it has been detected. NOTE 4: Unique identification supports traceability to changes made as needed by the change request management process (SUP.10).",
        "title": "Identify and record the problem. Each problem is uniquely identified, described and recorded. A status is assigned to each problem to facilitate tracking. Supporting information is provided to reproduce and diagnose the problem. NOTE 1: Problems may relate to e.g., product, resources, or methods. NOTE 2: Example values for the problem status are “new”, “solved”, “closed”, etc. NOTE 3: Supporting information may include e.g, the origin of the problem, how it can be reproduced, environmental information, by whom it has been detected. NOTE 4: Unique identification supports traceability to changes made as needed by the change request management process (SUP.10)."
      },
      {
        "id": "BP2",
        "text": "SUP.9.BP2: Determine the cause and the impact of the problem. Analyze the problem, determine its cause, including common causes if existing, and impact. Involve relevant parties. Categorize the problem. NOTE 5: Problem categorization (e.g., light, medium, severe) may be based on severity, criticality, urgency, etc.",
        "title": "Determine the cause and the impact of the problem. Analyze the problem, determine its cause, including common causes if existing, and impact. Involve relevant parties. Categorize the problem. NOTE 5: Problem categorization (e.g., light, medium, severe) may be based on severity, criticality, urgency, etc."
      },
      {
        "id": "BP3",
        "text": "SUP.9.BP3: Authorize urgent resolution action. Obtain authorization for immediate action if a problem requires an urgent resolution according to the categorization.",
        "title": "Authorize urgent resolution action. Obtain authorization for immediate action if a problem requires an urgent resolution according to the categorization."
      },
      {
        "id": "BP4",
        "text": "SUP.9.BP4: Raise alert notifications. If according to the categorization the problem has a high impact on other systems or other affected parties, an alert notification needs to be raised accordingly.",
        "title": "Raise alert notifications. If according to the categorization the problem has a high impact on other systems or other affected parties, an alert notification needs to be raised accordingly."
      },
      {
        "id": "BP5",
        "text": "SUP.9.BP5: Initiate problem resolution. Initiate appropriate actions according to the categorization to resolve the problem long-term, including review of those actions or initiate a change request. This includes synchronization and consistency with short-term urgent resolution actions, if applicable.",
        "title": "Initiate problem resolution. Initiate appropriate actions according to the categorization to resolve the problem long-term, including review of those actions or initiate a change request. This includes synchronization and consistency with short-term urgent resolution actions, if applicable."
      },
      {
        "id": "BP6",
        "text": "SUP.9.BP6: Track problems to closure. Track the status of problems to closure including all related change requests. The closure of problems is accepted by relevant stakeholders.",
        "title": "Track problems to closure. Track the status of problems to closure including all related change requests. The closure of problems is accepted by relevant stakeholders."
      },
      {
        "id": "BP7",
        "text": "SUP.9.BP7: Report the status of problem resolution activities. Collect and analyze problem resolution management data, identify trends, and initiate related actions. Regularly report the results of data analysis, the identified trends and the status of problem resolution activities to relevant stakeholders. Outcome 3 Outcome 4 X X X X Outcome 5 Outcome 2 SUP.9 Problem Resolution Management Outcome 1 NOTE 6: Collected data may contain information about where the problems occurred, how and when they were found, what their impacts were, etc. Output Information Items 13-07 Problem 15-55 Problem analysis evidence X 15-12 Problem status X Base Practices BP1: Identify and record the problem X BP2: Determine the cause and the impact of the problem X X X BP3: Authorize urgent resolution action X BP4: Raise alert notifications X BP5: Initiate problem resolution X BP6: Track problems to closure X BP7: Report the status of problem resolution activities X X",
        "title": "Report the status of problem resolution activities. Collect and analyze problem resolution management data, identify trends, and initiate related actions. Regularly report the results of data analysis, the identified trends and the status of problem resolution activities to relevant stakeholders. Outcome 3 Outcome 4 X X X X Outcome 5 Outcome 2 SUP.9 Problem Resolution Management Outcome 1 NOTE 6: Collected data may contain information about where the problems occurred, how and when they were found, what their impacts were, etc. Output Information Items 13-07 Problem 15-55 Problem analysis evidence X 15-12 Problem status X Base Practices BP1: Identify and record the problem X BP2: Determine the cause and the impact of the problem X X X BP3: Authorize urgent resolution action X BP4: Raise alert notifications X BP5: Initiate problem resolution X BP6: Track problems to closure X BP7: Report the status of problem resolution activities X X"
