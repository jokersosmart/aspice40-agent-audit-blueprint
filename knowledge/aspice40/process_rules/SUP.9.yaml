  "pam": {
    "purpose": "The purpose of the Problem Resolution Management Process is to ensure that problems are identified, recorded, analyzed, and their resolution is managed and controlled.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1)"
      },
