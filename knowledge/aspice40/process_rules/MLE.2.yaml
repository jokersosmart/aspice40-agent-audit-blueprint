  "pam": {
    "purpose": "The purpose is to establish an ML architecture supporting training and deployment, consistent with the ML requirements, and to evaluate the ML architecture against defined criteria.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A ML architecture is developed."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Hyperparameter ranges and initial values are determined as a basis for the training."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Evaluation of ML architectural elements is conducted."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Interfaces of the ML architectural elements are defined."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Resource consumption objectives for the ML architectural elements are defined."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Consistency and bidirectional traceability are established between the ML architectural elements and the ML requirements."
      },
      {
        "id": "OUTCOME.7",
        "text": "7) The ML architecture is agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MLE.2.BP1: Develop ML architecture. Develop and document the ML architecture that specifies ML architectural elements including details of the ML model, pre- and postprocessing, and hyperparameters which are required to create, train, test, and deploy the ML model. Note 1: Necessary details of the ML model may include layers, activation functions, and backpropagation. The level of detail of the ML model may not need to cover aspects like single neurons. Note 2: The details of the ML model may differ between the ML model used during training and the deployed ML model.",
        "title": "Develop ML architecture. Develop and document the ML architecture that specifies ML architectural elements including details of the ML model, pre- and postprocessing, and hyperparameters which are required to create, train, test, and deploy the ML model. Note 1: Necessary details of the ML model may include layers, activation functions, and backpropagation. The level of detail of the ML model may not need to cover aspects like single neurons. Note 2: The details of the ML model may differ between the ML model used during training and the deployed ML model."
      },
      {
        "id": "BP2",
        "text": "MLE.2.BP2: Determine hyperparameter ranges and initial values. Determine and document the hyperparameter ranges and the initial values as a basis for the training.",
        "title": "Determine hyperparameter ranges and initial values. Determine and document the hyperparameter ranges and the initial values as a basis for the training."
      },
      {
        "id": "BP3",
        "text": "MLE.2.BP3: Analyze ML architectural elements. Define criteria for analysis of the ML architectural elements. Analyze ML architectural elements according to the defined criteria. Note 3: Trustworthiness and explainability might be criteria for the analysis of the ML architectural elements.",
        "title": "Analyze ML architectural elements. Define criteria for analysis of the ML architectural elements. Analyze ML architectural elements according to the defined criteria. Note 3: Trustworthiness and explainability might be criteria for the analysis of the ML architectural elements."
      },
      {
        "id": "BP4",
        "text": "MLE.2.BP4: Define interfaces of the ML architectural elements. Determine and document the internal and external interfaces of each ML architectural element including its interfaces to related software components.",
        "title": "Define interfaces of the ML architectural elements. Determine and document the internal and external interfaces of each ML architectural element including its interfaces to related software components."
      },
      {
        "id": "BP5",
        "text": "MLE.2.BP5: Define resource consumption objectives for the ML architectural elements. Determine and document the resource consumption objectives for all relevant ML architectural elements during training and deployment.",
        "title": "Define resource consumption objectives for the ML architectural elements. Determine and document the resource consumption objectives for all relevant ML architectural elements during training and deployment."
      },
      {
        "id": "BP6",
        "text": "MLE.2.BP6: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML architectural elements and the ML requirements. Note 4: Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 5: The bidirectional traceability should be established on a reasonable level of abstraction to the ML architectural elements. Outcome 4 Outcome 5 X X X X Outcome 7 Outcome 3 X Outcome 6 Outcome 2 MLE.2 Machine Learning Architecture Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the ML architectural elements and the ML requirements. Note 4: Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 5: The bidirectional traceability should be established on a reasonable level of abstraction to the ML architectural elements. Outcome 4 Outcome 5 X X X X Outcome 7 Outcome 3 X Outcome 6 Outcome 2 MLE.2 Machine Learning Architecture Outcome 1"
      },
      {
        "id": "BP7",
        "text": "MLE.2.BP7: Communicate agreed ML architecture. Inform all affected parties about the agreed ML architecture including the details of the ML model and the initial hyperparameter values. Output Information Items 04-51 ML architecture 13-52 Communication evidence X 13-51 Consistency evidence X 01-54 Hyperparameter X 15-51 Analysis results X X X Base Practices BP1: Develop ML architecture X BP2: Determine hyperparameter ranges and initial values. BP3: Evaluate ML architectural elements X X BP4: Define interfaces of the ML architectural elements BP5: Define resource consumption objectives for the ML architectural elements BP6: Ensure consistency and establish bidirectional traceability BP7: Communicate agreed ML architecture X X X X",
        "title": "Communicate agreed ML architecture. Inform all affected parties about the agreed ML architecture including the details of the ML model and the initial hyperparameter values. Output Information Items 04-51 ML architecture 13-52 Communication evidence X 13-51 Consistency evidence X 01-54 Hyperparameter X 15-51 Analysis results X X X Base Practices BP1: Develop ML architecture X BP2: Determine hyperparameter ranges and initial values. BP3: Evaluate ML architectural elements X X BP4: Define interfaces of the ML architectural elements BP5: Define resource consumption objectives for the ML architectural elements BP6: Ensure consistency and establish bidirectional traceability BP7: Communicate agreed ML architecture X X X X"
