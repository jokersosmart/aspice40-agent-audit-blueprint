        "id": "OUTCOME.5",
        "text": "5) System requirements are specified. System requirements are structured and prioritized. System requirements are analyzed for correctness and technical feasibility. The impact of system requirements on the operating environment is analyzed. Consistency and bidirectional traceability are established between system requirements and stakeholder requirements."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) The system requirements are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SYS.2.BP1: Specify system requirements. Use the stakeholder requirements to identify and document the functional and non-functional requirements for the system according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO 26262-8:2018, or the INCOSE Guide For Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by technical standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement).",
        "title": "Specify system requirements. Use the stakeholder requirements to identify and document the functional and non-functional requirements for the system according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO 26262-8:2018, or the INCOSE Guide For Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by technical standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement)."
      },
      {
        "id": "BP2",
        "text": "SYS.2.BP2: Structure system requirements. Structure and prioritize the system requirements. Note 3: Examples for structuring criteria can be grouping (e.g., by functionality) or product variants identification. Note 4: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Please refer to SPL.2.BP1.",
        "title": "Structure system requirements. Structure and prioritize the system requirements. Note 3: Examples for structuring criteria can be grouping (e.g., by functionality) or product variants identification. Note 4: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Please refer to SPL.2.BP1."
      },
      {
        "id": "BP3",
        "text": "SYS.2.BP3: Analyze system requirements. Analyze the specified system requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 5: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 6: Technical feasibility can be evaluated based on e.g., platform or product line, or by means of prototype development or product demonstrators.",
        "title": "Analyze system requirements. Analyze the specified system requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 5: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 6: Technical feasibility can be evaluated based on e.g., platform or product line, or by means of prototype development or product demonstrators."
      },
      {
        "id": "BP4",
        "text": "SYS.2.BP4: Analyze the impact on the system context. Analyze the impact that the system requirements will have on elements in the relevant system context.",
        "title": "Analyze the impact on the system context. Analyze the impact that the system requirements will have on elements in the relevant system context."
      },
      {
        "id": "BP5",
        "text": "SYS.2.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between system requirements and stakeholder requirements. Note 7: Bidirectional traceability supports consistency, facilitates impact analyses of change requests, and supports the demonstration of coverage of stakeholder requirements. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 8: There may be non-functional stakeholder requirements that the system requirements do not trace to. Examples are process requirements. Such stakeholder requirements are still subject to verification. Outcome 6 Outcome 5 X Outcome 4 X Outcome 3 Outcome 2 SYS.2 System Requirements Analysis Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between system requirements and stakeholder requirements. Note 7: Bidirectional traceability supports consistency, facilitates impact analyses of change requests, and supports the demonstration of coverage of stakeholder requirements. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 8: There may be non-functional stakeholder requirements that the system requirements do not trace to. Examples are process requirements. Such stakeholder requirements are still subject to verification. Outcome 6 Outcome 5 X Outcome 4 X Outcome 3 Outcome 2 SYS.2 System Requirements Analysis Outcome 1"
      },
      {
        "id": "BP6",
        "text": "SYS.2.BP6: Communicate agreed system requirements and impact on the system context. Communicate the agreed system requirements, and results of the impact analysis on the system context, to all affected parties. Output Information Items 17-00 Requirement 17-54 Requirement Attribute X 15-51 Analysis Results X X X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify system requirements X BP2: Structure system requirements X BP3: Analyze system requirements X BP4: Analyze the impact on the system context BP5: Ensure consistency and establish bidirectional traceability X X BP6: Communicate agreed system requirements and impact on the system context X",
        "title": "Communicate agreed system requirements and impact on the system context. Communicate the agreed system requirements, and results of the impact analysis on the system context, to all affected parties. Output Information Items 17-00 Requirement 17-54 Requirement Attribute X 15-51 Analysis Results X X X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify system requirements X BP2: Structure system requirements X BP3: Analyze system requirements X BP4: Analyze the impact on the system context BP5: Ensure consistency and establish bidirectional traceability X X BP6: Communicate agreed system requirements and impact on the system context X"
      }
