  "pam": {
    "purpose": "The purpose of the Quality Assurance Process is to provide independent and objective assurance that work products and processes comply with defined criteria and that nonconformances are resolved and further prevented.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Quality assurance is performed independently and objectively without conflicts of interest."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Criteria for the quality of work products and process performance are defined."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Conformance of work products and process performance with the defined criteria and targets is verified, documented and communicated to the relevant parties."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Non-conformances are tracked, resolved, and further prevented."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Non-conformances are escalated to appropriate levels of management."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Management ensures that escalated non-conformances are resolved."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SUP.1.BP1: Ensure independence of quality assurance. Ensure that quality assurance is performed independently and objectively without conflicts of interest. Note 1: Possible inputs for evaluating the independence may be assignment to financial and/or organizational structure as well as responsibility for processes that are subject to quality assurance (no self-monitoring).",
        "title": "Ensure independence of quality assurance. Ensure that quality assurance is performed independently and objectively without conflicts of interest. Note 1: Possible inputs for evaluating the independence may be assignment to financial and/or organizational structure as well as responsibility for processes that are subject to quality assurance (no self-monitoring)."
      },
      {
        "id": "BP2",
        "text": "SUP.1.BP2: Define criteria for quality assurance. Define quality criteria for work products as well as for process tasks and their performance. Note 2: Quality criteria may consider internal and external inputs such as customer requirements, standards, milestones, etc.",
        "title": "Define criteria for quality assurance. Define quality criteria for work products as well as for process tasks and their performance. Note 2: Quality criteria may consider internal and external inputs such as customer requirements, standards, milestones, etc."
      },
      {
        "id": "BP3",
        "text": "SUP.1.BP3: Assure quality of work products. Identify work products subject to quality assurance according to the quality criteria. Perform appropriate activities to evaluate the work products against the defined quality criteria and document the results. Note 3: Quality assurance activities may include reviews, problem analysis and lessons learned that improve the work products for further use.",
        "title": "Assure quality of work products. Identify work products subject to quality assurance according to the quality criteria. Perform appropriate activities to evaluate the work products against the defined quality criteria and document the results. Note 3: Quality assurance activities may include reviews, problem analysis and lessons learned that improve the work products for further use."
      },
      {
        "id": "BP4",
        "text": "SUP.1.BP4: Assure quality of process activities. Identify processes subject to quality assurance according to the quality criteria. Perform appropriate activities to evaluate the processes against their defined quality criteria and associated target values and document the results. NOTE 4: Quality assurance activities may include process assessments, problem analysis, regular check of methods, tools, and the adherence to defined processes, and consideration of lessons learned.",
        "title": "Assure quality of process activities. Identify processes subject to quality assurance according to the quality criteria. Perform appropriate activities to evaluate the processes against their defined quality criteria and associated target values and document the results. NOTE 4: Quality assurance activities may include process assessments, problem analysis, regular check of methods, tools, and the adherence to defined processes, and consideration of lessons learned."
      },
      {
        "id": "BP5",
        "text": "SUP.1.BP5: Summarize and communicate quality assurance activities and results. Regularly report performance, non-conformances, and trends of quality assurance activities to all affected parties.",
        "title": "Summarize and communicate quality assurance activities and results. Regularly report performance, non-conformances, and trends of quality assurance activities to all affected parties."
      },
      {
        "id": "BP6",
        "text": "SUP.1.BP6: Ensure resolution of non-conformances. Analyze, track, correct, resolve, and further prevent non-conformances found in quality assurance activities. NOTE 5: Non-conformances detected in work products may be entered into the problem resolution management process (SUP.9). NOTE 6: Non-conformances detected in the process definition or implementation may be entered into a process improvement process (PIM.3).",
        "title": "Ensure resolution of non-conformances. Analyze, track, correct, resolve, and further prevent non-conformances found in quality assurance activities. NOTE 5: Non-conformances detected in work products may be entered into the problem resolution management process (SUP.9). NOTE 6: Non-conformances detected in the process definition or implementation may be entered into a process improvement process (PIM.3)."
      },
      {
        "id": "BP7",
        "text": "SUP.1.BP7: Escalate non-conformances. Escalate relevant non-conformances to appropriate levels of management and other relevant stakeholders to facilitate their resolution. Outcome 6 Outcome 5 Outcome 4 Outcome 3 SUP.1 Quality Assurance Outcome 2 Outcome 1 NOTE 7: The decision whether to escalate non-conformances may be based on criteria such as delay of resolution, urgency, and risk. Output Information Items 16-50 Organizational structure X X 18-52 Escalation path X 18-07 Quality criteria X X X 13-52 Communication evidence X X 13-18 Quality conformance evidence X X 13-19 Review evidence X X 14-02 Corrective action X X X X Base Practices BP1: Ensure independence of quality assurance. BP2: Define criteria for quality assurance. X X BP3: Assure quality of work products. X X BP4: Assure quality of process activities. X X BP5: Summarize and communicate quality assurance activities and results. BP6: Ensure resolution of non-conformances. X X X X BP7: Escalate non-conformances. X X X",
        "title": "Escalate non-conformances. Escalate relevant non-conformances to appropriate levels of management and other relevant stakeholders to facilitate their resolution. Outcome 6 Outcome 5 Outcome 4 Outcome 3 SUP.1 Quality Assurance Outcome 2 Outcome 1 NOTE 7: The decision whether to escalate non-conformances may be based on criteria such as delay of resolution, urgency, and risk. Output Information Items 16-50 Organizational structure X X 18-52 Escalation path X 18-07 Quality criteria X X X 13-52 Communication evidence X X 13-18 Quality conformance evidence X X 13-19 Review evidence X X 14-02 Corrective action X X X X Base Practices BP1: Ensure independence of quality assurance. BP2: Define criteria for quality assurance. X X BP3: Assure quality of work products. X X BP4: Assure quality of process activities. X X BP5: Summarize and communicate quality assurance activities and results. BP6: Ensure resolution of non-conformances. X X X X BP7: Escalate non-conformances. X X X"
      }
    ]
