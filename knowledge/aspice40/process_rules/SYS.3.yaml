  "pam": {
    "purpose": "The purpose is to establish an analyzed system architecture, comprising static and dynamic aspects, consistent with the system requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A system architecture is designed including a definition of the system elements with their behavior, their interfaces, their relationships, and their interactions."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) The system architecture is analyzed against defined criteria, and special characteristics are identified."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Consistency and bidirectional traceability are established between system architecture and system requirements."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) The agreed system architecture and the special characteristics are communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SYS.3.BP1: Specify static aspects of the system architecture. Specify and document the static aspects of the system architecture with respect to the functional and non-functional system requirements, including external interfaces and a defined set of system elements with their interfaces and relationships.",
        "title": "Specify static aspects of the system architecture. Specify and document the static aspects of the system architecture with respect to the functional and non-functional system requirements, including external interfaces and a defined set of system elements with their interfaces and relationships."
      },
      {
        "id": "BP2",
        "text": "SYS.3.BP2: Specify dynamic aspects of the system architecture. Specify and document the dynamic aspects of the system architecture with respect to the functional and non-functional system requirements including the behavior of the system elements and their interaction in different system modes. Note 1: Examples of interactions of system elements are timing diagrams reflecting inertia of mechanical components, processing times of ECUs, and signal propagation times of bus systems.",
        "title": "Specify dynamic aspects of the system architecture. Specify and document the dynamic aspects of the system architecture with respect to the functional and non-functional system requirements including the behavior of the system elements and their interaction in different system modes. Note 1: Examples of interactions of system elements are timing diagrams reflecting inertia of mechanical components, processing times of ECUs, and signal propagation times of bus systems."
      },
      {
        "id": "BP3",
        "text": "SYS.3.BP3: Analyze system architecture. Analyze the system architecture regarding relevant technical design aspects related to the product lifecycle, and to support project management regarding project estimates, and derive special characteristics for non-software system elements. Document a rationale for the system architectural design decisions. Note 2: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 3: Examples for product lifecycle phases are production, maintenance & repair, decommissioning. Note 4: Examples for technical aspects are manufacturability for production, suitability of pre-existing system elements to be reused, or availability of system elements. Note 5: Examples for methods being suitable for analyzing technical aspects are prototypes, simulations, and qualitative analyses (e.g., FMEA approaches) Note 6: Examples of design rationales are proven-in-use, reuse of a product platform or product line), a make-or-buy decision, or found in an evolutionary way (e.g., set-based design).",
        "title": "Analyze system architecture. Analyze the system architecture regarding relevant technical design aspects related to the product lifecycle, and to support project management regarding project estimates, and derive special characteristics for non-software system elements. Document a rationale for the system architectural design decisions. Note 2: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 3: Examples for product lifecycle phases are production, maintenance & repair, decommissioning. Note 4: Examples for technical aspects are manufacturability for production, suitability of pre-existing system elements to be reused, or availability of system elements. Note 5: Examples for methods being suitable for analyzing technical aspects are prototypes, simulations, and qualitative analyses (e.g., FMEA approaches) Note 6: Examples of design rationales are proven-in-use, reuse of a product platform or product line), a make-or-buy decision, or found in an evolutionary way (e.g., set-based design)."
      },
      {
        "id": "BP4",
        "text": "SYS.3.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the elements of the system architecture and the system requirements that represent properties or characteristics of the physical end product. Note 7: Bidirectional traceability further supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 8: There may be non-functional requirements that the system architectural design does not trace to. Examples are do not address, or represent, direct properties or characteristics of the physical end product. Such requirements are still subject to verification. Outcome 4 Outcome 3 SYS.3 System Architectural Design Outcome 2 Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the elements of the system architecture and the system requirements that represent properties or characteristics of the physical end product. Note 7: Bidirectional traceability further supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 8: There may be non-functional requirements that the system architectural design does not trace to. Examples are do not address, or represent, direct properties or characteristics of the physical end product. Such requirements are still subject to verification. Outcome 4 Outcome 3 SYS.3 System Architectural Design Outcome 2 Outcome 1"
      },
      {
