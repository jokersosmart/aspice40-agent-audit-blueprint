        "text": "SYS.3.BP5: Communicate agreed system architecture. Communicate the agreed system architecture, including the special characteristics, to all affected parties. Output Information Items 04-06 System Architecture X 13-51 Consistency Evidence X 13-52 Communication Evidence X 15-51 Analysis Results X 17-57 Special Characteristics X Base Practices BP1: Specify static aspects of system architecture X BP2: Specify dynamic aspects of system architecture X BP3: Analyze the system architecture X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed system architecture X",
        "title": "Communicate agreed system architecture. Communicate the agreed system architecture, including the special characteristics, to all affected parties. Output Information Items 04-06 System Architecture X 13-51 Consistency Evidence X 13-52 Communication Evidence X 15-51 Analysis Results X 17-57 Special Characteristics X Base Practices BP1: Specify static aspects of system architecture X BP2: Specify dynamic aspects of system architecture X BP3: Analyze the system architecture X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed system architecture X"
