      {
        "id": "OUTCOME.5",
        "text": "5) Hardware requirements are specified. Hardware requirements are structured and prioritized. Hardware requirements are analyzed for correctness and technical feasibility. The impact of hardware requirements on the operating environment is analyzed. Consistency and bidirectional traceability are established between hardware requirements and system requirements."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Consistency and bidirectional traceability are established between hardware requirements and system architectural design."
      },
      {
        "id": "OUTCOME.7",
        "text": "7) The hardware requirements are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "HWE.1.BP1: Specify hardware requirements. Use the system requirements, and the system architecture including interface definitions, to identify and document the functional and nonfunctional requirements of the hardware according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO/IEC IEEE 24765, ISO 26262-8:2018, or the INCOSE Guide For Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by the above-mentioned standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement). Note 3: In case of hardware-only development, the system requirements and the system architecture refer to a given operating environment. In that case, stakeholder requirements can be used as the basis for identifying the required functions and capabilities of the hardware. Note 4: The hardware-software-interface (HSI) definition puts in context software and therefore is an interface decision at the system design level. If such a HSI exists, then it may provide input to hardware requirements.",
        "title": "Specify hardware requirements. Use the system requirements, and the system architecture including interface definitions, to identify and document the functional and nonfunctional requirements of the hardware according to defined characteristics for requirements. Note 1: Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO/IEC IEEE 24765, ISO 26262-8:2018, or the INCOSE Guide For Writing Requirements. Note 2: Examples for defined characteristics of requirements shared by the above-mentioned standards are verifiability (i.e., verification criteria being inherent in the requirements text), unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any other requirement). Note 3: In case of hardware-only development, the system requirements and the system architecture refer to a given operating environment. In that case, stakeholder requirements can be used as the basis for identifying the required functions and capabilities of the hardware. Note 4: The hardware-software-interface (HSI) definition puts in context software and therefore is an interface decision at the system design level. If such a HSI exists, then it may provide input to hardware requirements."
      },
      {
        "id": "BP2",
        "text": "HWE.1.BP2: Structure hardware requirements. Structure and prioritize the hardware requirements. Note 5: Examples for structuring criteria can be grouping (e.g., by functionality) or variants identification. Note 6: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1.",
        "title": "Structure hardware requirements. Structure and prioritize the hardware requirements. Note 5: Examples for structuring criteria can be grouping (e.g., by functionality) or variants identification. Note 6: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1."
      },
      {
        "id": "BP3",
        "text": "HWE.1.BP3: Analyze hardware requirements. Analyze the specified hardware requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 7: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 8: The analyses of technical feasibility can be done based on a given hardware design (e.g., platform) or by prototype development.",
        "title": "Analyze hardware requirements. Analyze the specified hardware requirements including their interdependencies to ensure correctness, technical feasibility, and to support project management regarding project estimates. Note 7: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates. Note 8: The analyses of technical feasibility can be done based on a given hardware design (e.g., platform) or by prototype development."
      },
      {
        "id": "BP4",
        "text": "HWE.1.BP4: Analyze the impact on the operating environment. Identify the interfaces between the specified hardware and other elements of the operating environment. Analyze the impact that the hardware requirements will have on these interfaces and the operating environment.",
        "title": "Analyze the impact on the operating environment. Identify the interfaces between the specified hardware and other elements of the operating environment. Analyze the impact that the hardware requirements will have on these interfaces and the operating environment."
      },
      {
        "id": "BP5",
        "text": "HWE.1.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish traceability between hardware requirements and the system architecture. Ensure consistency and establish traceability between hardware requirements and system requirements. Note 9: Redundant traceability is not intended. Note 10: There may be non-functional hardware requirements that the hardware design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 11: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 12: In case of hardware development only, the system requirements and system architecture refer to a given operating environment. In that case, consistency and bidirectional traceability can be ensured between stakeholder requirements and hardware requirements. Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 HWE.1 Hardware Requirements Analysis Outcome 2 Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish traceability between hardware requirements and the system architecture. Ensure consistency and establish traceability between hardware requirements and system requirements. Note 9: Redundant traceability is not intended. Note 10: There may be non-functional hardware requirements that the hardware design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 11: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 12: In case of hardware development only, the system requirements and system architecture refer to a given operating environment. In that case, consistency and bidirectional traceability can be ensured between stakeholder requirements and hardware requirements. Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 HWE.1 Hardware Requirements Analysis Outcome 2 Outcome 1"
      },
      {
        "id": "BP6",
        "text": "HWE.1.BP6: Communicate agreed hardware requirements and impact on the operating environment. Communicate the agreed hardware requirements and results of the analysis of impact on the operating environment to all affected parties. Output Information Items 13-52 Communication Evidence X 13-51 Consistency Evidence X 17-00 Requirement X X X X 17-54 Requirement Attribute X 15-51 Analysis Results X X Base Practices BP1: Specify hardware requirements X BP2: Structure hardware requirements X BP3: Analyze hardware requirements X BP4: Analyze the impact on the operating environment BP5: Ensure consistency and establish bidirectional traceability BP6: Communicate agreed hardware requirements X X X X",
        "title": "Communicate agreed hardware requirements and impact on the operating environment. Communicate the agreed hardware requirements and results of the analysis of impact on the operating environment to all affected parties. Output Information Items 13-52 Communication Evidence X 13-51 Consistency Evidence X 17-00 Requirement X X X X 17-54 Requirement Attribute X 15-51 Analysis Results X X Base Practices BP1: Specify hardware requirements X BP2: Structure hardware requirements X BP3: Analyze hardware requirements X BP4: Analyze the impact on the operating environment BP5: Ensure consistency and establish bidirectional traceability BP6: Communicate agreed hardware requirements X X X X"
      }
