  },
  "pam": {
    "purpose": "The purpose is to ensure that the production data compliant hardware is verified to provide evidence for compliance with the hardware design.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures are specified for verification of the hardware against the hardware design, including the interfaces between hardware elements and the dynamic aspects."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Verification measures are selected according to the release scope considering criteria, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Verification is performed on production data compliant samples using the selected verification measures, and verification results are recorded."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between hardware elements and verification measures."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Bidirectional traceability is established between verification measures and verification results."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Verification results are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "HWE.3.BP1: Specify verification measures for the verification against hardware design. Specify the verification measures suitable to provide evidence for compliance of the hardware with the hardware design and its dynamic aspects. This includes • techniques for the verification measures, • pass/fail criteria for the verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of the verification measures, and • the required verification infrastructure and environment setup. Note 1: Examples on what a verification measure may focus on are the timeliness and timing dependencies of the correct signal flow between interfacing hardware elements, interactions between hardware components. Note 2: Measuring points can be used for stepwise testing of hardware elements.",
        "title": "Specify verification measures for the verification against hardware design. Specify the verification measures suitable to provide evidence for compliance of the hardware with the hardware design and its dynamic aspects. This includes • techniques for the verification measures, • pass/fail criteria for the verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of the verification measures, and • the required verification infrastructure and environment setup. Note 1: Examples on what a verification measure may focus on are the timeliness and timing dependencies of the correct signal flow between interfacing hardware elements, interactions between hardware components. Note 2: Measuring points can be used for stepwise testing of hardware elements."
      },
      {
        "id": "BP2",
        "text": "HWE.3.BP2: Ensure use of compliant samples. Ensure that the samples used for verification against hardware design are compliant with the corresponding production data, including special characteristics. Ensure that deviations are documented and that they do not alter verification results. Note 3: Examples of compliance are sample reports, record of visual inspection, ICT report.",
        "title": "Ensure use of compliant samples. Ensure that the samples used for verification against hardware design are compliant with the corresponding production data, including special characteristics. Ensure that deviations are documented and that they do not alter verification results. Note 3: Examples of compliance are sample reports, record of visual inspection, ICT report."
      },
      {
        "id": "BP3",
        "text": "HWE.3.BP3: Select verification measures. Document the selection of verification measures considering selection criteria including regression criteria. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 4: Examples for selection criteria can be prioritization of requirements, the need for regression due to changes to the hardware design, or the intended use of the delivered hardware release (e.g., test bench, test track, public road etc.)",
        "title": "Select verification measures. Document the selection of verification measures considering selection criteria including regression criteria. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 4: Examples for selection criteria can be prioritization of requirements, the need for regression due to changes to the hardware design, or the intended use of the delivered hardware release (e.g., test bench, test track, public road etc.)"
      },
      {
        "id": "BP4",
        "text": "HWE.3.BP4: Verify hardware design. Verify the hardware design using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure output data. Note 5: See SUP.9 for handling of non-conformances.",
        "title": "Verify hardware design. Verify the hardware design using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure output data. Note 5: See SUP.9 for handling of non-conformances."
      },
      {
        "id": "BP5",
        "text": "HWE.3.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between hardware elements and the verification measures. Establish bidirectional traceability between the verification measures and verification results. Note 6: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between hardware elements and the verification measures. Establish bidirectional traceability between the verification measures and verification results. Note 6: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP6",
        "text": "HWE.3.BP6: Summarize and communicate results. Summarize the verification results and communicate them to all affected parties. Outcome 5 X X Outcome 6 Outcome 4 Outcome 3 Outcome 2 HWE.3 Verification against Hardware Design Outcome 1 Note 7: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence 13-52 Communication Evidence X Base Practices BP1: Specify verification measures for the verification against hardware design X BP2: Ensure use of compliant samples X BP3: Select verification measures X BP4: Verify hardware design X BP5: Ensure consistency and establish bidirectional traceability BP6: Summarize and communicate results X X X",
        "title": "Summarize and communicate results. Summarize the verification results and communicate them to all affected parties. Outcome 5 X X Outcome 6 Outcome 4 Outcome 3 Outcome 2 HWE.3 Verification against Hardware Design Outcome 1 Note 7: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence 13-52 Communication Evidence X Base Practices BP1: Specify verification measures for the verification against hardware design X BP2: Ensure use of compliant samples X BP3: Select verification measures X BP4: Verify hardware design X BP5: Ensure consistency and establish bidirectional traceability BP6: Summarize and communicate results X X X"
      }
    ]
  },
