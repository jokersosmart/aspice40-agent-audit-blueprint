  },
  "pam": {
    "purpose": "The purpose is to refine the machine learning-related software requirements into a set of ML requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) The ML requirements including ML data requirements are identified and specified based on the software requirements and the components of the software architecture."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) ML requirements are structured and prioritized."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) ML requirements are analyzed for correctness and verifiability."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) The impact of ML requirements on the ML operating environment is analyzed."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Consistency and bidirectional traceability are established between ML requirements and software requirements, and between ML requirements and software architecture."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) The ML requirements are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MLE.1.BP1: Specify ML requirements. Use the software requirements and the software architecture to identify and specify functional and non-functional ML requirements, as well as ML data requirements specifying data characteristics (e.g., gender, weather conditions, street conditions within the ODD) and their expected distributions. Note 1: Non-functional requirements may include relevant characteristics of the ODD and KPIs as robustness, performance, and level of trustworthiness. Note 2: The ML data requirements are input for SUP.11 Machine Learning Data Management but also for other MLE processes. Note 3: In case of ML development only, stakeholder requirements represent the software requirements.",
        "title": "Specify ML requirements. Use the software requirements and the software architecture to identify and specify functional and non-functional ML requirements, as well as ML data requirements specifying data characteristics (e.g., gender, weather conditions, street conditions within the ODD) and their expected distributions. Note 1: Non-functional requirements may include relevant characteristics of the ODD and KPIs as robustness, performance, and level of trustworthiness. Note 2: The ML data requirements are input for SUP.11 Machine Learning Data Management but also for other MLE processes. Note 3: In case of ML development only, stakeholder requirements represent the software requirements."
      },
      {
        "id": "BP2",
        "text": "MLE.1.BP2: Structure ML requirements. Structure and prioritize the ML requirements. Note 4: Examples for structuring criteria can be grouping (e.g., by functionality) or variants identification. Note 5: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1.",
        "title": "Structure ML requirements. Structure and prioritize the ML requirements. Note 4: Examples for structuring criteria can be grouping (e.g., by functionality) or variants identification. Note 5: Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1."
      },
      {
        "id": "BP3",
        "text": "MLE.1.BP3: Analyze ML requirements. Analyze the specified ML requirements including their interdependencies to ensure correctness, technical feasibility, and ability for machine learning model testing, and to support project management regarding project estimates. Note 6: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates.",
        "title": "Analyze ML requirements. Analyze the specified ML requirements including their interdependencies to ensure correctness, technical feasibility, and ability for machine learning model testing, and to support project management regarding project estimates. Note 6: See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates."
      },
      {
        "id": "BP4",
        "text": "MLE.1.BP4: Analyze the impact on the ML operating environment. Analyze the impact that the ML requirements will have on interfaces of software components and the ML operating environment. Note 7: The ML operating environment is defined as the infrastructure and information which both the trained ML model and the deployed ML model need for execution.",
        "title": "Analyze the impact on the ML operating environment. Analyze the impact that the ML requirements will have on interfaces of software components and the ML operating environment. Note 7: The ML operating environment is defined as the infrastructure and information which both the trained ML model and the deployed ML model need for execution."
      },
      {
        "id": "BP5",
        "text": "MLE.1.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between ML requirements and software requirements and between ML requirements and the software architecture. Note 8: Bidirectional traceability supports consistency, facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 9: Redundant traceability is not intended, but at least one out of the given traceability paths. Outcome 6 Outcome 5 X Outcome 4 X Outcome 3 Outcome 2 MLE.1 Machine Learning Requirements Analysis Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between ML requirements and software requirements and between ML requirements and the software architecture. Note 8: Bidirectional traceability supports consistency, facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Note 9: Redundant traceability is not intended, but at least one out of the given traceability paths. Outcome 6 Outcome 5 X Outcome 4 X Outcome 3 Outcome 2 MLE.1 Machine Learning Requirements Analysis Outcome 1"
      },
      {
        "id": "BP6",
        "text": "MLE.1.BP6: Communicate agreed ML requirements and impact on the operating environment. Communicate the agreed ML requirements, and the results of the impact analysis on the ML operating environment to all affected parties. Output Information Items 17-00 Requirement 17-54 Requirement attribute X X 13-52 Communication evidence X 13-51 Consistency evidence X 15-51 Analysis results X X Base Practices BP1: Specify ML requirements X BP2: Structure ML requirements X BP3: Analyze ML requirements X BP4: Analyze the impact on the ML operating environment BP5: Ensure consistency and establish bidirectional traceability X X BP6: Communicate agreed ML requirements X",
        "title": "Communicate agreed ML requirements and impact on the operating environment. Communicate the agreed ML requirements, and the results of the impact analysis on the ML operating environment to all affected parties. Output Information Items 17-00 Requirement 17-54 Requirement attribute X X 13-52 Communication evidence X 13-51 Consistency evidence X 15-51 Analysis results X X Base Practices BP1: Specify ML requirements X BP2: Structure ML requirements X BP3: Analyze ML requirements X BP4: Analyze the impact on the ML operating environment BP5: Ensure consistency and establish bidirectional traceability X X BP6: Communicate agreed ML requirements X"
      }
    ]
  },
