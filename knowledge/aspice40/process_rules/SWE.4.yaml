  "pam": {
    "purpose": "The purpose is to verify that software units are consistent with the software detailed design.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures for software unit verification are specified."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Software unit verification measures are selected according to the release scope, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Software units are verified using the selected verification measures, and results are recorded."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between verification measures and software units; and bidirectional traceability is established between verification results and verification measures."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Results of the software unit verification are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SWE.4.BP1: Specify software unit verification measures. Specify verification measures for each software unit defined in the software detailed design, including • pass/fail criteria for verification measures, • entry and exit criteria for verification measures, and • the required verification infrastructure. Note 1: Examples for unit verification measures are static analysis, code reviews, and unit testing. Note 2: Static analysis can be done based on MISRA rulesets and other coding standards.",
        "title": "Specify software unit verification measures. Specify verification measures for each software unit defined in the software detailed design, including • pass/fail criteria for verification measures, • entry and exit criteria for verification measures, and • the required verification infrastructure. Note 1: Examples for unit verification measures are static analysis, code reviews, and unit testing. Note 2: Static analysis can be done based on MISRA rulesets and other coding standards."
      },
      {
        "id": "BP2",
        "text": "SWE.4.BP2: Select software unit verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope.",
        "title": "Select software unit verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope."
      },
      {
        "id": "BP3",
        "text": "SWE.4.BP3: Verify software units. Perform software unit verification using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling of verification results that deviate from expected results.",
        "title": "Verify software units. Perform software unit verification using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling of verification results that deviate from expected results."
      },
      {
        "id": "BP4",
        "text": "SWE.4.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and the software units defined in the detailed design. Establish bidirectional traceability between the verification results and the verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and the software units defined in the detailed design. Establish bidirectional traceability between the verification results and the verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP5",
        "text": "SWE.4.BP5: Summarize and communicate results. Summarize the results of software unit verification and communicate them to all affected parties. Outcome 5 Outcome 4 Outcome 3 SWE.4 Software Unit Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify software unit verification measures X BP2: Select software unit verification measures BP3: Verify software units X X BP4: Ensure consistency and establish bidirectional traceability for software unit verification BP5: Summarize and communicate results X X",
        "title": "Summarize and communicate results. Summarize the results of software unit verification and communicate them to all affected parties. Outcome 5 Outcome 4 Outcome 3 SWE.4 Software Unit Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify software unit verification measures X BP2: Select software unit verification measures BP3: Verify software units X X BP4: Ensure consistency and establish bidirectional traceability for software unit verification BP5: Summarize and communicate results X X"
