  },
  "pam": {
    "purpose": "The purpose is to integrate systems elements and verify that the integrated system elements are consistent with the system architecture.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures are specified for system integration verification of the integrated system elements based on the system architecture, including the interfaces of, and interactions between, system elements."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) System elements are integrated up to a complete integrated system consistent with the release scope."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Verification measures are selected according to the release scope considering criteria, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Integrated system elements are verified using the selected verification measures, and the results of the system integration verification are recorded."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Consistency and bidirectional traceability are established between verification measures and the elements of the system architecture."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Bidirectional traceability between verification results and verification measures is established."
      },
      {
        "id": "OUTCOME.7",
        "text": "7) Results of the system integration and integration verification are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SYS.4.BP1: Specify verification measures for system integration. Specify the verification measures, based on a defined sequence and preconditions for the integration of system elements against the system static and dynamic aspects of the system architecture, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, and • the required verification infrastructure and environment setup. Note 1: Examples on what a verification measure may focus are the timing dependencies of the correct signal flow between interfacing system elements, or interactions between hardware and software, as specified in the system architecture. The system integration test cases may focus on • the correct signal flow between system items, • the timeliness and timing dependencies of signal flow between system items, • the correct interpretation of signals by all system items using an interface, and/or • the dynamic interaction between system items.",
        "title": "Specify verification measures for system integration. Specify the verification measures, based on a defined sequence and preconditions for the integration of system elements against the system static and dynamic aspects of the system architecture, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, and • the required verification infrastructure and environment setup. Note 1: Examples on what a verification measure may focus are the timing dependencies of the correct signal flow between interfacing system elements, or interactions between hardware and software, as specified in the system architecture. The system integration test cases may focus on • the correct signal flow between system items, • the timeliness and timing dependencies of signal flow between system items, • the correct interpretation of signals by all system items using an interface, and/or • the dynamic interaction between system items."
      },
      {
        "id": "BP2",
        "text": "SYS.4.BP2: Select verification measures. Document the selection of verification measures for each integration step considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for selection criteria can be prioritization of requirements, the need for regression verification (due to e.g., changes to the system architectural design or to system components), or the intended use of the delivered product release (e.g., test bench, test track, public road etc.)",
        "title": "Select verification measures. Document the selection of verification measures for each integration step considering selection criteria including criteria for regression verification. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for selection criteria can be prioritization of requirements, the need for regression verification (due to e.g., changes to the system architectural design or to system components), or the intended use of the delivered product release (e.g., test bench, test track, public road etc.)"
      },
      {
        "id": "BP3",
        "text": "SYS.4.BP3: Integrate system elements and perform integration verification. Integrate the system elements until the system is fully integrated according to the specified interfaces and interactions between the system elements, and according to the defined sequence and defined preconditions. Perform the selected system integration verification measures. Record the verification measure data including pass/fail status and corresponding verification measure data. Note 3: Examples for preconditions for starting system integration can be successful system element verification or qualification of pre-existing system elements. Note 4: See SUP.9 for handling verification results that deviate from expected results",
        "title": "Integrate system elements and perform integration verification. Integrate the system elements until the system is fully integrated according to the specified interfaces and interactions between the system elements, and according to the defined sequence and defined preconditions. Perform the selected system integration verification measures. Record the verification measure data including pass/fail status and corresponding verification measure data. Note 3: Examples for preconditions for starting system integration can be successful system element verification or qualification of pre-existing system elements. Note 4: See SUP.9 for handling verification results that deviate from expected results"
      },
      {
        "id": "BP4",
        "text": "SYS.4.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and the system architecture. Establish bidirectional traceability between verification results and verification measures. Note 5: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and the system architecture. Establish bidirectional traceability between verification results and verification measures. Note 5: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP5",
        "text": "SYS.4.BP5: Summarize and communicate results. Summarize the system integration and integration verification results and communicate them to all affected parties. Outcome 6 X X Outcome 7 Outcome 5 Outcome 4 Outcome 3 Outcome 2 SYS.4 System Integration and Integration Verification Outcome 1 Note 6: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 06-50 Integration Sequence Instruction X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence 13-52 Communication Evidence X 11-06 Integrated System X Base Practices BP1: Specify verification measures for system integration X BP2: Select verification measures X BP3: Integrate system elements and perform integration verification. BP4: Ensure consistency and establish bidirectional traceability X X X X BP5: Summarize and communicate results X",
        "title": "Summarize and communicate results. Summarize the system integration and integration verification results and communicate them to all affected parties. Outcome 6 X X Outcome 7 Outcome 5 Outcome 4 Outcome 3 Outcome 2 SYS.4 System Integration and Integration Verification Outcome 1 Note 6: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. Output Information Items 08-60 Verification Measure X 06-50 Integration Sequence Instruction X 03-50 Verification Measure Data X 08-58 Verification Measure Selection Set X 15-52 Verification Results X 13-51 Consistency Evidence 13-52 Communication Evidence X 11-06 Integrated System X Base Practices BP1: Specify verification measures for system integration X BP2: Select verification measures X BP3: Integrate system elements and perform integration verification. BP4: Ensure consistency and establish bidirectional traceability X X X X BP5: Summarize and communicate results X"
      }
