  },
  "pam": {
    "purpose": "The purpose is to ensure that the complete hardware is verified to be consistent with the hardware requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures are specified for verification of the hardware against the hardware requirements."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Verification measures are selected considering criteria, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Verification is performed, if applicable on production data compliant samples, using the selected verification measures, and verification results are recorded."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between verification measures and hardware requirements."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Bidirectional traceability is established between verification measures and verification results."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Verification results are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "HWE.4.BP1: Specify verification measures for the verification against hardware requirements. Specify the verification measure to provide evidence for compliance with the hardware requirements. This includes • techniques for the verification measures, • pass/fail criteria for the verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification the measures, and • the required verification infrastructure and environment setup Note 1: The verification measures may cover aspects such as thermal, environmental, robustness/lifetime, and EMC.",
        "title": "Specify verification measures for the verification against hardware requirements. Specify the verification measure to provide evidence for compliance with the hardware requirements. This includes • techniques for the verification measures, • pass/fail criteria for the verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification the measures, and • the required verification infrastructure and environment setup Note 1: The verification measures may cover aspects such as thermal, environmental, robustness/lifetime, and EMC."
      },
      {
        "id": "BP2",
        "text": "HWE.4.BP2: Ensure use of compliant samples. Ensure that the samples used for the verification against hardware requirements are compliant with the corresponding production data, including special characteristics, provided by hardware design. Note 2: Examples of compliance are sample reports, record of visual inspection, ICT report.",
        "title": "Ensure use of compliant samples. Ensure that the samples used for the verification against hardware requirements are compliant with the corresponding production data, including special characteristics, provided by hardware design. Note 2: Examples of compliance are sample reports, record of visual inspection, ICT report."
      },
      {
        "id": "BP3",
        "text": "HWE.4.BP3: Select verification measures. Document the selection of verification measures considering selection criteria including regression criteria. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 3: Examples for selection criteria can be prioritization of requirements, the need for regression due to changes to the hardware requirements, or the intended use of the delivered hardware release (e.g, test bench, test track, public road etc.).",
        "title": "Select verification measures. Document the selection of verification measures considering selection criteria including regression criteria. The documented selection of verification measures shall have sufficient coverage according to the release scope. Note 3: Examples for selection criteria can be prioritization of requirements, the need for regression due to changes to the hardware requirements, or the intended use of the delivered hardware release (e.g, test bench, test track, public road etc.)."
      },
      {
        "id": "BP4",
        "text": "HWE.4.BP4: Verify the compliant hardware samples. Verify the compliant hardware samples using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure output data. Note 4: See SUP.9 for handling of non-conformances.",
        "title": "Verify the compliant hardware samples. Verify the compliant hardware samples using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure output data. Note 4: See SUP.9 for handling of non-conformances."
      },
      {
        "id": "BP5",
        "text": "HWE.4.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency between hardware requirements and verification measures. Establish bidirectional traceability between hardware requirements and verification measures. Establish bidirectional traceability between verification measures and verification results. Note 5: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency between hardware requirements and verification measures. Establish bidirectional traceability between hardware requirements and verification measures. Establish bidirectional traceability between verification measures and verification results. Note 5: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP6",
        "text": "HWE.4.BP6: Summarize and communicate results. Summarize the verification results and communicate them to all affected parties. X X Outcome 6 Outcome 5 Outcome 3 Outcome 4 Output Information Items 08-60 Verification Measure 03-50 Verification Measure Data 08-58 Verification Measure Selection Set 15-52 Verification Results 13-51 Consistency Evidence 13-52 Communication Evidence Base Practices BP1: Specify verification measures for the verification against hardware requirements BP2: Ensure use of compliant samples BP3: Select verification measures BP4: Verify hardware BP5: Ensure consistency and establish bidirectional traceability BP6: Summarize and communicate results Outcome 2 HWE.4 Verification against Hardware Requirements Outcome 1 Note 6: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. X X X X X X X X X X X X 4.8. Supporting process group (SUP)",
        "title": "Summarize and communicate results. Summarize the verification results and communicate them to all affected parties. X X Outcome 6 Outcome 5 Outcome 3 Outcome 4 Output Information Items 08-60 Verification Measure 03-50 Verification Measure Data 08-58 Verification Measure Selection Set 15-52 Verification Results 13-51 Consistency Evidence 13-52 Communication Evidence Base Practices BP1: Specify verification measures for the verification against hardware requirements BP2: Ensure use of compliant samples BP3: Select verification measures BP4: Verify hardware BP5: Ensure consistency and establish bidirectional traceability BP6: Summarize and communicate results Outcome 2 HWE.4 Verification against Hardware Requirements Outcome 1 Note 6: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. X X X X X X X X X X X X 4.8. Supporting process group (SUP)"
      }
