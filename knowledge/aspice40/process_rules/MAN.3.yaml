  "pam": {
    "purpose": "The purpose is to identify and control the activities, and establish resources necessary for a project to develop a product, in the context of the project’s requirements and constraints.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) The scope of the work for the project is defined."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) The feasibility of achieving the goals of the project with available resources and constraints is evaluated."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) The activities and resources necessary to complete the work are sized and estimated."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Interfaces within the project, and with other projects and organizational units, are identified and monitored."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Plans for the execution of the project are developed, implemented and maintained."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Progress of the project is monitored and reported."
      },
      {
        "id": "OUTCOME.7",
        "text": "7) Adjustment is performed when project goals are not achieved."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MAN.3.BP1: Define the scope of work. Identify the project's goals, motivation and boundaries.",
        "title": "Define the scope of work. Identify the project's goals, motivation and boundaries."
      },
      {
        "id": "BP2",
        "text": "MAN.3.BP2: Define project life cycle. Define the life cycle for the project, which is appropriate to the scope, context, and complexity of the project. Define a release scope for relevant milestones. Note 1: This may include the alignment of the project life cycle with the customer's development process.",
        "title": "Define project life cycle. Define the life cycle for the project, which is appropriate to the scope, context, and complexity of the project. Define a release scope for relevant milestones. Note 1: This may include the alignment of the project life cycle with the customer's development process."
      },
      {
        "id": "BP3",
        "text": "MAN.3.BP3: Evaluate feasibility of the project. Evaluate the feasibility of achieving the goals of the project with respect to time, project estimates, and available resources. Note 2: The evaluation of feasibility may consider technical constraints of the project.",
        "title": "Evaluate feasibility of the project. Evaluate the feasibility of achieving the goals of the project with respect to time, project estimates, and available resources. Note 2: The evaluation of feasibility may consider technical constraints of the project."
      },
      {
        "id": "BP4",
        "text": "MAN.3.BP4: Define and monitor work packages. Define and monitor work packages and their dependencies according to defined project life cycle and estimations. Note 3: The structure and the size of the work packages support an adequate progress monitoring. Note 4: Work packages may be organized in a work breakdown structure.",
        "title": "Define and monitor work packages. Define and monitor work packages and their dependencies according to defined project life cycle and estimations. Note 3: The structure and the size of the work packages support an adequate progress monitoring. Note 4: Work packages may be organized in a work breakdown structure."
      },
      {
        "id": "BP5",
        "text": "MAN.3.BP5: Define and monitor project estimates and resources. Define and monitor project estimates of effort and resources based on project's goals, project risks, motivation and boundaries. Note 5: Examples of necessary resources are budget, people, product samples, or infrastructure Note 6: Project risks (using MAN.5) may be considered. Note 7: Estimations and resources may include engineering, management and supporting processes.",
        "title": "Define and monitor project estimates and resources. Define and monitor project estimates of effort and resources based on project's goals, project risks, motivation and boundaries. Note 5: Examples of necessary resources are budget, people, product samples, or infrastructure Note 6: Project risks (using MAN.5) may be considered. Note 7: Estimations and resources may include engineering, management and supporting processes."
      },
      {
        "id": "BP6",
        "text": "MAN.3.BP6: Define and monitor required skills, knowledge, and experience. Identify and monitor the required skills, knowledge, and experience for the project in line with the estimates and work packages. Note 8: Training, mentoring or coaching of individuals may be applied to resolve deviations from required skills and knowledge.",
        "title": "Define and monitor required skills, knowledge, and experience. Identify and monitor the required skills, knowledge, and experience for the project in line with the estimates and work packages. Note 8: Training, mentoring or coaching of individuals may be applied to resolve deviations from required skills and knowledge."
      },
      {
        "id": "BP7",
        "text": "MAN.3.BP7: Define and monitor project interfaces and agreed commitments. Identify and agree interfaces of the project with affected stakeholders and monitor agreed commitments. Define an escalation mechanism for commitments that are not fulfilled. Note 9: Affected stakeholders may include other projects, organizational units, sub-contractors, and service providers.",
        "title": "Define and monitor project interfaces and agreed commitments. Identify and agree interfaces of the project with affected stakeholders and monitor agreed commitments. Define an escalation mechanism for commitments that are not fulfilled. Note 9: Affected stakeholders may include other projects, organizational units, sub-contractors, and service providers."
      },
      {
        "id": "BP8",
        "text": "MAN.3.BP8: Define and monitor project schedule. Allocate resources to work packages and schedule each activity of the project. Monitor the performance of activities against schedule.",
        "title": "Define and monitor project schedule. Allocate resources to work packages and schedule each activity of the project. Monitor the performance of activities against schedule."
      },
      {
        "id": "BP9",
        "text": "MAN.3.BP9: Ensure consistency. Regularly adjust estimates, resources, skills, work packages and their dependencies, schedules, plans, interfaces, and commitments for the project to ensure consistency with the scope of work. Note 10: This may include the consideration of critical dependencies, that are an input for risk management.",
        "title": "Ensure consistency. Regularly adjust estimates, resources, skills, work packages and their dependencies, schedules, plans, interfaces, and commitments for the project to ensure consistency with the scope of work. Note 10: This may include the consideration of critical dependencies, that are an input for risk management."
      },
      {
        "id": "BP10",
        "text": "MAN.3.BP10: Review and report progress of the project. Regularly review and report the status of the project and the fulfillment of work packages against estimated effort and duration to all affected parties. Prevent recurrence of identified problems. Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 MAN.3 Project Management Outcome 2 Outcome 1 Note 11: Project reviews may be executed at regular intervals by the management. Project reviews may contribute to identify best practices and lessons learned. Note 12: Refer to SUP.9 for resolution of problems Output Information Items 08-53 Scope of work X 08-54 Feasibility analysis X 14-10 Work package X X X X 13-52 Communication evidence X X 13-16 Change request X 13-51 Consistency evidence X X 14-02 Corrective action 18-52 Escalation path X 08-56 Schedule X X X X X X 14-50 Stakeholder groups list X 15-06 Project status X X X Base Practices BP1: Define the scope of work X BP2: Define project life cycle X BP3: Evaluate feasibility of the project X X BP4: Define and monitor work packages X BP5: Define and monitor project estimates and resources X X X X X X BP6: Define and monitor required skills, knowledge, and experience X X BP7: Define and monitor project interfaces and agreed commitments X X BP8: Define and monitor project schedule X X BP9: Ensure consistency X X X BP10: Review and report progress of the project X X X X",
        "title": "Review and report progress of the project. Regularly review and report the status of the project and the fulfillment of work packages against estimated effort and duration to all affected parties. Prevent recurrence of identified problems. Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 MAN.3 Project Management Outcome 2 Outcome 1 Note 11: Project reviews may be executed at regular intervals by the management. Project reviews may contribute to identify best practices and lessons learned. Note 12: Refer to SUP.9 for resolution of problems Output Information Items 08-53 Scope of work X 08-54 Feasibility analysis X 14-10 Work package X X X X 13-52 Communication evidence X X 13-16 Change request X 13-51 Consistency evidence X X 14-02 Corrective action 18-52 Escalation path X 08-56 Schedule X X X X X X 14-50 Stakeholder groups list X 15-06 Project status X X X Base Practices BP1: Define the scope of work X BP2: Define project life cycle X BP3: Evaluate feasibility of the project X X BP4: Define and monitor work packages X BP5: Define and monitor project estimates and resources X X X X X X BP6: Define and monitor required skills, knowledge, and experience X X BP7: Define and monitor project interfaces and agreed commitments X X BP8: Define and monitor project schedule X X BP9: Ensure consistency X X X BP10: Review and report progress of the project X X X X"
