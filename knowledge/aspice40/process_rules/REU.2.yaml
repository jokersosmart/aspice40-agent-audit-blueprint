      {
        "id": "OUTCOME.6",
        "text": "6) Products for reuse are selected using defined criteria. Products for reuse are analyzed for portability and interoperability. Limitations for reuse are defined and communicated. Products for reuse are verified. Products for reuse are provided to affected parties. Communication mechanism is established with the reuse product provider."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "REU.2.BP1: Select products for reuse. Select the products to be reused using defined criteria. Note 1: Products for reuse may be systems, hardware or software components, third party components or legacy components.",
        "title": "Select products for reuse. Select the products to be reused using defined criteria. Note 1: Products for reuse may be systems, hardware or software components, third party components or legacy components."
      },
      {
        "id": "BP2",
        "text": "REU.2.BP2: Analyze the reuse capability of the product. Analyze the designated target architecture and the product to be reused to determine its applicability in the target architecture according to relevant criteria. Note 2: Examples for criteria can be requirements compliance, verifiability of the product to be reused in the target architecture, or portability/interoperability.",
        "title": "Analyze the reuse capability of the product. Analyze the designated target architecture and the product to be reused to determine its applicability in the target architecture according to relevant criteria. Note 2: Examples for criteria can be requirements compliance, verifiability of the product to be reused in the target architecture, or portability/interoperability."
      },
      {
        "id": "BP3",
        "text": "REU.2.BP3: Define limitations for reuse. Define and communicate limitations for the products to be reused. Note 3: Limitations may address parameters of operational environment.",
        "title": "Define limitations for reuse. Define and communicate limitations for the products to be reused. Note 3: Limitations may address parameters of operational environment."
      },
      {
        "id": "BP4",
        "text": "REU.2.BP4: Ensure qualification of products for reuse. Provide evidence that the product for reuse is qualified for the intended use of the deliverable. Note 4: Qualification may be demonstrated by verification evidence. Note 5: Verification may include the appropriateness of documentation.",
        "title": "Ensure qualification of products for reuse. Provide evidence that the product for reuse is qualified for the intended use of the deliverable. Note 4: Qualification may be demonstrated by verification evidence. Note 5: Verification may include the appropriateness of documentation."
      },
      {
        "id": "BP5",
        "text": "REU.2.BP5: Provide products for reuse. Make available the product to be reused to affected parties. Note 6: Refer to HWE.3, SWE.5 or SYS.4 for more information on integration of hardware, software, or system components.",
        "title": "Provide products for reuse. Make available the product to be reused to affected parties. Note 6: Refer to HWE.3, SWE.5 or SYS.4 for more information on integration of hardware, software, or system components."
      },
      {
        "id": "BP6",
        "text": "REU.2.BP6: Communicate information about effectiveness of reuse activities. Establish communication and notification mechanism about experiences and technical outcomes to the provider of reused products. Outcome 6 X Outcome 5 X Outcome 4 Outcome 3 REU.2 Management of Products for Reuse Outcome 2 Outcome 1 Note 7: The communication with the provider of a reused product may depend on whether the product is under development or not. Output Information Items 04-02 Domain architecture 12-03 Reuse candidate X X 13-52 Communication evidence X 15-07 Reuse analysis evidence X X 13-53 Qualification evidence X Base Practices BP1: Select products for reuse X BP2: Analyze the reuse capability of the product BP3: Define limitations for reuse X BP4: Ensure qualification of products for reuse BP5: Provide products for reuse X X X BP6: Communicate information about effectiveness of reuse activities X",
        "title": "Communicate information about effectiveness of reuse activities. Establish communication and notification mechanism about experiences and technical outcomes to the provider of reused products. Outcome 6 X Outcome 5 X Outcome 4 Outcome 3 REU.2 Management of Products for Reuse Outcome 2 Outcome 1 Note 7: The communication with the provider of a reused product may depend on whether the product is under development or not. Output Information Items 04-02 Domain architecture 12-03 Reuse candidate X X 13-52 Communication evidence X 15-07 Reuse analysis evidence X X 13-53 Qualification evidence X Base Practices BP1: Select products for reuse X BP2: Analyze the reuse capability of the product BP3: Define limitations for reuse X BP4: Ensure qualification of products for reuse BP5: Provide products for reuse X X X BP6: Communicate information about effectiveness of reuse activities X"
