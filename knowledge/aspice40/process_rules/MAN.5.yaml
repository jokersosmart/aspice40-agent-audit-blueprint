  "pam": {
    "purpose": "The purpose is to Regularly identify, analyze, treat and monitor process related risks and product related risks.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) The sources of risks are identified and regularly updated."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Potential undesirable events are identified as they develop during the conduct of the project."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Risks are analyzed and the priority in which to apply resources to treatment of these risks is determined."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Risk measures are defined, applied, and assessed to determine changes in the status of risk and the progress of the risk treatment activities."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Appropriate treatment is taken to correct or avoid the impact of risk based on its priority, probability, and consequence or other defined risk threshold."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MAN.5.BP1: Identify sources of risks. Identify and regularly update the sources of risks with affected parties. Note 1: Risks may include technical, economical, and schedule risks. Note 2: Risks may include the suppliers’ deliverables and services. Note 3: The risk sources may vary across the entire project life cycle.",
        "title": "Identify sources of risks. Identify and regularly update the sources of risks with affected parties. Note 1: Risks may include technical, economical, and schedule risks. Note 2: Risks may include the suppliers’ deliverables and services. Note 3: The risk sources may vary across the entire project life cycle."
      },
      {
        "id": "BP2",
        "text": "MAN.5.BP2: Identify potential undesirable events. Identify potential undesirable events within the scope of the risk management for the project.",
        "title": "Identify potential undesirable events. Identify potential undesirable events within the scope of the risk management for the project."
      },
      {
        "id": "BP3",
        "text": "MAN.5.BP3: Determine risks. Determine the probability and severity of the undesirable events to support priorities for the mitigation of the risks. Note 4: Different methods may be used to analyze technical risks of a system, for example, functional analysis, simulation, FMEA, FTA etc.",
        "title": "Determine risks. Determine the probability and severity of the undesirable events to support priorities for the mitigation of the risks. Note 4: Different methods may be used to analyze technical risks of a system, for example, functional analysis, simulation, FMEA, FTA etc."
      },
      {
        "id": "BP4",
        "text": "MAN.5.BP4: Define risk treatment options. For each risk select a treatment option to accept, mitigate, avoid, or share (transfer) the risk.",
        "title": "Define risk treatment options. For each risk select a treatment option to accept, mitigate, avoid, or share (transfer) the risk."
      },
      {
        "id": "BP5",
        "text": "MAN.5.BP5: Define and perform risk treatment activities. Define and perform risk activities for risk treatment options.",
        "title": "Define and perform risk treatment activities. Define and perform risk activities for risk treatment options."
      },
      {
        "id": "BP6",
        "text": "MAN.5.BP6: Monitor risks. Regularly re-evaluate the risk related to the identified potential undesirable events to determine changes in the status of a risk and to evaluate the progress of the risk treatment activities. Note 5: Risks of high priority may need to be communicated to and monitored by higher levels of management.",
        "title": "Monitor risks. Regularly re-evaluate the risk related to the identified potential undesirable events to determine changes in the status of a risk and to evaluate the progress of the risk treatment activities. Note 5: Risks of high priority may need to be communicated to and monitored by higher levels of management."
      },
      {
        "id": "BP7",
        "text": "MAN.5.BP7: Take corrective action. When risk treatment activities are not effective, take appropriate corrective action. Outcome 3 X X X 15-09 Risk status X Outcome 5 Outcome 2 15-51 Analysis results MAN.5 Risk Management Outcome 4 Outcome 1 Note 6: Corrective actions may involve reevaluation of risks, developing and implementing new mitigation concepts or adjusting the existing concepts. Output Information Items 08-55 Risk measure X X X X X X 14-02 Corrective action X X BP4: Define risk treatment options X X BP5: Define and perform risk treatment activities. X X BP6: Monitor risks X Base Practices BP1: Identify sources of risks X BP2: Identify potential undesirable events X BP3: Determine risks X BP7: Take corrective action X",
        "title": "Take corrective action. When risk treatment activities are not effective, take appropriate corrective action. Outcome 3 X X X 15-09 Risk status X Outcome 5 Outcome 2 15-51 Analysis results MAN.5 Risk Management Outcome 4 Outcome 1 Note 6: Corrective actions may involve reevaluation of risks, developing and implementing new mitigation concepts or adjusting the existing concepts. Output Information Items 08-55 Risk measure X X X X X X 14-02 Corrective action X X BP4: Define risk treatment options X X BP5: Define and perform risk treatment activities. X X BP6: Monitor risks X Base Practices BP1: Identify sources of risks X BP2: Identify potential undesirable events X BP3: Determine risks X BP7: Take corrective action X"
      }
    ]
  },
