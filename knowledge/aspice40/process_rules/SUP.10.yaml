  "pam": {
    "purpose": "The purpose of the Change Request Management Process is to ensure that change requests are recorded, analyzed, tracked, approved, and implemented.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Requests for changes are recorded and identified."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Change requests are analyzed, dependencies and relationships to other change requests are identified, and the impact is estimated."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Change requests are approved before implementation and prioritized accordingly."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Bidirectional traceability is established between change requests and affected work products."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Implementation of change requests is confirmed."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Change requests are tracked to closure and status of change requests is communicated to affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SUP.10.BP1: Identify and record the change requests. The scope for application of change requests is identified. Each change request is uniquely identified, described, and recorded, including the initiator and reason of the change request. A status is assigned to each change request to facilitate tracking. NOTE 1: Change requests may be used for changes related to e.g., product, process, methods. NOTE 2: Example values for the change request status are “open”, “under investigation”, “implemented”, etc. NOTE 3: The change request handling may differ across the product life cycle e.g., during prototype construction and series development",
        "title": "Identify and record the change requests. The scope for application of change requests is identified. Each change request is uniquely identified, described, and recorded, including the initiator and reason of the change request. A status is assigned to each change request to facilitate tracking. NOTE 1: Change requests may be used for changes related to e.g., product, process, methods. NOTE 2: Example values for the change request status are “open”, “under investigation”, “implemented”, etc. NOTE 3: The change request handling may differ across the product life cycle e.g., during prototype construction and series development"
      },
      {
        "id": "BP2",
        "text": "SUP.10.BP2: Analyze and assess change requests. Change requests are analyzed by relevant parties according to analysis criteria. Work products affected by the change request and dependencies to other change requests are determined. The impact of the change requests is assessed. NOTE 4: Examples for analysis criteria are: resource requirements, scheduling issues, risks, benefits, etc.",
        "title": "Analyze and assess change requests. Change requests are analyzed by relevant parties according to analysis criteria. Work products affected by the change request and dependencies to other change requests are determined. The impact of the change requests is assessed. NOTE 4: Examples for analysis criteria are: resource requirements, scheduling issues, risks, benefits, etc."
      },
      {
        "id": "BP3",
        "text": "SUP.10.BP3: Approve change requests before implementation. Change requests are prioritized and approved for implementation based on analysis results and availability of resources. NOTE 5: A Change Control Board (CCB) is an example mechanism used to approve change requests. NOTE 6: Prioritization of change requests may be done by allocation to releases.",
        "title": "Approve change requests before implementation. Change requests are prioritized and approved for implementation based on analysis results and availability of resources. NOTE 5: A Change Control Board (CCB) is an example mechanism used to approve change requests. NOTE 6: Prioritization of change requests may be done by allocation to releases."
      },
      {
        "id": "BP4",
        "text": "SUP.10.BP4: Establish bidirectional traceability. Establish bidirectional traceability between change requests and work products affected by the change requests. In case that the change request is initiated by a problem, establish bidirectional traceability between change requests and the corresponding problem reports.",
        "title": "Establish bidirectional traceability. Establish bidirectional traceability between change requests and work products affected by the change requests. In case that the change request is initiated by a problem, establish bidirectional traceability between change requests and the corresponding problem reports."
      },
      {
        "id": "BP5",
        "text": "SUP.10.BP5: Confirm the implementation of change requests. The implementation of change requests is confirmed before closure by relevant stakeholders.",
        "title": "Confirm the implementation of change requests. The implementation of change requests is confirmed before closure by relevant stakeholders."
      },
      {
        "id": "BP6",
        "text": "SUP.10.BP6: Track change requests to closure. Change requests are tracked to closure. The status of change requests is communicated to all affected parties. Outcome 5 Outcome 6 Outcome 4 Outcome 3 SUP.10 Change Request Management Outcome 2 Outcome 1 NOTE 7: Examples for informing affected parties can be daily standup meetings or tool-supported workflows. X X Output Information Items 18-57 Change analysis criteria X 13-16 Change request X X X 13-51 Consistency evidence X Base Practices BP1: Identify and record the change requests X BP2: Analyze and assess change requests X BP3: Approve change requests before implementation BP4: Establish bidirectional traceability X BP5: Confirm the implementation of change requests X X BP6: Track change requests to closure X",
        "title": "Track change requests to closure. Change requests are tracked to closure. The status of change requests is communicated to all affected parties. Outcome 5 Outcome 6 Outcome 4 Outcome 3 SUP.10 Change Request Management Outcome 2 Outcome 1 NOTE 7: Examples for informing affected parties can be daily standup meetings or tool-supported workflows. X X Output Information Items 18-57 Change analysis criteria X 13-16 Change request X X X 13-51 Consistency evidence X Base Practices BP1: Identify and record the change requests X BP2: Analyze and assess change requests X BP3: Approve change requests before implementation BP4: Establish bidirectional traceability X BP5: Confirm the implementation of change requests X X BP6: Track change requests to closure X"
      }
