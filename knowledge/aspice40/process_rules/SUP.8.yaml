      },
      {
        "id": "OUTCOME.8",
        "text": "8) Selection criteria for configuration items are defined and applied. Configuration item properties are defined. Configuration management is established. Modifications are controlled. Baselining is applied. The status of the configuration items is recorded and reported. The completeness and consistency of the baselines is ensured. The availability of backup and recovery mechanisms is verified."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SUP.8.BP1: Identify configuration items. Define selection criteria for identifying relevant work products to be subject to configuration management. Identify and document configuration items according to the defined selection criteria. NOTE 1: Configuration items are representing work products or group of work products which are subject to configuration management as a single entity. NOTE 2: Configuration items may vary in complexity, size, and type, ranging from an entire system including all system, hardware, and software documentation down to a single element or document. NOTE 3: The selection criteria may be applied to single work products or a group of work products.",
        "title": "Identify configuration items. Define selection criteria for identifying relevant work products to be subject to configuration management. Identify and document configuration items according to the defined selection criteria. NOTE 1: Configuration items are representing work products or group of work products which are subject to configuration management as a single entity. NOTE 2: Configuration items may vary in complexity, size, and type, ranging from an entire system including all system, hardware, and software documentation down to a single element or document. NOTE 3: The selection criteria may be applied to single work products or a group of work products."
      },
      {
        "id": "BP2",
        "text": "SUP.8.BP2: Define configuration item properties. Define the necessary properties needed for the modification and control of configuration items. NOTE 4: The configuration item properties may be defined for single configuration items or a group of items. NOTE 5: Configuration item properties may include a status model (e.g., Under Work, Tested, Released, etc.), storage location, access rights, etc. NOTE 6: The application of properties may be implemented by attributes of configuration items.",
        "title": "Define configuration item properties. Define the necessary properties needed for the modification and control of configuration items. NOTE 4: The configuration item properties may be defined for single configuration items or a group of items. NOTE 5: Configuration item properties may include a status model (e.g., Under Work, Tested, Released, etc.), storage location, access rights, etc. NOTE 6: The application of properties may be implemented by attributes of configuration items."
      },
      {
        "id": "BP3",
        "text": "SUP.8.BP3: Establish configuration management. Establish configuration management mechanisms for control of identified configuration items including the configuration item properties, including mechanisms for controlling parallel modifications of configuration items. NOTE 7: This may include specific mechanisms for different configuration item types, such as branch and merge management, or checkout control.",
        "title": "Establish configuration management. Establish configuration management mechanisms for control of identified configuration items including the configuration item properties, including mechanisms for controlling parallel modifications of configuration items. NOTE 7: This may include specific mechanisms for different configuration item types, such as branch and merge management, or checkout control."
      },
      {
        "id": "BP4",
        "text": "SUP.8.BP4: Control modifications. Control modifications using the configuration management mechanisms. NOTE 8: This may include the application of a defined status model for configuration items.",
        "title": "Control modifications. Control modifications using the configuration management mechanisms. NOTE 8: This may include the application of a defined status model for configuration items."
      },
      {
        "id": "BP5",
        "text": "SUP.8.BP5: Establish baselines. Define and establish baselines for internal purposes, and for external product delivery, for all relevant configuration items.",
        "title": "Establish baselines. Define and establish baselines for internal purposes, and for external product delivery, for all relevant configuration items."
      },
      {
        "id": "BP6",
        "text": "SUP.8.BP6: Summarize and communicate configuration status. Record, summarize, and communicate the status of configuration items and established baselines to affected parties in order to support the monitoring of progress and status. NOTE 9: Regular communication of the configuration status, e.g., based on a defined status model supports project management, quality activities, and dedicated project phases such as software integration.",
        "title": "Summarize and communicate configuration status. Record, summarize, and communicate the status of configuration items and established baselines to affected parties in order to support the monitoring of progress and status. NOTE 9: Regular communication of the configuration status, e.g., based on a defined status model supports project management, quality activities, and dedicated project phases such as software integration."
      },
      {
        "id": "BP7",
        "text": "SUP.8.BP7: Ensure completeness and consistency. Ensure that the information about configuration items is correct and complete including configuration item properties. Ensure the completeness and consistency of baselines. NOTE 10: Completeness and consistency of a baseline means that all required configuration items are included and consistent, and have the required status. This can be used to support e.g., project gate approval.",
        "title": "Ensure completeness and consistency. Ensure that the information about configuration items is correct and complete including configuration item properties. Ensure the completeness and consistency of baselines. NOTE 10: Completeness and consistency of a baseline means that all required configuration items are included and consistent, and have the required status. This can be used to support e.g., project gate approval."
      },
      {
        "id": "BP8",
        "text": "SUP.8.BP8: Verify backup and recovery mechanisms availability. Verify the availability of appropriate backup and recovery mechanisms for the configuration management including the controlled configuration items. Initiate measures in case of insufficient backup and recovery mechanisms. Outcome 8 Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 SUP.8 Configuration Management Outcome 2 Outcome 1 NOTE 11: Backup and recovery mechanisms may be defined and implemented by organizational units outside the project team. This may include references to corresponding procedures or regulations. Output Information Items 18-53 Configuration item selection criteria X 01-52 Configuration item list X 16-03 Configuration management system X X 13-08 Baseline X X X X X 14-01 Change history X X X 15-56 Configuration status X 13-51 Consistency Evidence X 06-52 Backup and recovery mechanism information X Base Practices BP1: Identify configuration items X BP2: Define configuration item properties X BP3: Establish configuration management X BP4: Control modifications X X BP5: Establish baselines X BP6: Summarize and communicate configuration status BP7: Ensure completeness and consistency X X BP8: Verify backup and recovery mechanisms availability X",
        "title": "Verify backup and recovery mechanisms availability. Verify the availability of appropriate backup and recovery mechanisms for the configuration management including the controlled configuration items. Initiate measures in case of insufficient backup and recovery mechanisms. Outcome 8 Outcome 7 Outcome 6 Outcome 5 Outcome 4 Outcome 3 SUP.8 Configuration Management Outcome 2 Outcome 1 NOTE 11: Backup and recovery mechanisms may be defined and implemented by organizational units outside the project team. This may include references to corresponding procedures or regulations. Output Information Items 18-53 Configuration item selection criteria X 01-52 Configuration item list X 16-03 Configuration management system X X 13-08 Baseline X X X X X 14-01 Change history X X X 15-56 Configuration status X 13-51 Consistency Evidence X 06-52 Backup and recovery mechanism information X Base Practices BP1: Identify configuration items X BP2: Define configuration item properties X BP3: Establish configuration management X BP4: Control modifications X X BP5: Establish baselines X BP6: Summarize and communicate configuration status BP7: Ensure completeness and consistency X X BP8: Verify backup and recovery mechanisms availability X"
