  "pam": {
    "purpose": "The purpose is to Collect and analyze data relating to the development results and processes implemented within the organization and its projects, to support effective management of the processes.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) The measurement information needs that are necessary to evaluate the achievement of process objectives and the achievement of desired work products are identified."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) An appropriate set of metrics, driven by the information needs are identified and/or developed."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Measurement activities are identified and performed."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) The required metrics are collected, stored, analyzed, and the results interpreted."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Metrics are used to support decisions and provide an objective basis for communication."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "MAN.6.BP1: Identify information needs. Identify the measurement information needs that are necessary to evaluate the achievement of process objectives and work products. Note 1: Information needs may change over time. Therefore, the measurement process may be used in an iterative way.",
        "title": "Identify information needs. Identify the measurement information needs that are necessary to evaluate the achievement of process objectives and work products. Note 1: Information needs may change over time. Therefore, the measurement process may be used in an iterative way."
      },
      {
        "id": "BP2",
        "text": "MAN.6.BP2: Specify metrics. Identify and develop an appropriate set of metrics based on measurement information needs. Note 2: Metrics may be related to processes or development results.",
        "title": "Specify metrics. Identify and develop an appropriate set of metrics based on measurement information needs. Note 2: Metrics may be related to processes or development results."
      },
      {
        "id": "BP3",
        "text": "MAN.6.BP3: Collect and store metrics. Collect and store both base and derived metrics, including any context information necessary to verify and understand the metrics. Note 3: Base metrics in the context of this process are directly gathered metrics like “number of defects found” or “number of lines of code”, where derived metrics are two or more metrics that are brought in relation to each other like “number of defects found per line of code”.",
        "title": "Collect and store metrics. Collect and store both base and derived metrics, including any context information necessary to verify and understand the metrics. Note 3: Base metrics in the context of this process are directly gathered metrics like “number of defects found” or “number of lines of code”, where derived metrics are two or more metrics that are brought in relation to each other like “number of defects found per line of code”."
      },
      {
        "id": "BP4",
        "text": "MAN.6.BP4: Analyze collected metrics. Analyze, interpret and review measured values to support decision-making.",
        "title": "Analyze collected metrics. Analyze, interpret and review measured values to support decision-making."
      },
      {
        "id": "BP5",
        "text": "MAN.6.BP5: Communicate analysis results. Communicate analysis results to all affected parties. Outcome 4 Outcome 5 Outcome 3 03-03 Benchmarking data X X 03-04 Customer satisfaction data X X 03-06 Process performance information X X X X X X MAN.6 Measurement Outcome 2 Outcome 1",
        "title": "Communicate analysis results. Communicate analysis results to all affected parties. Outcome 4 Outcome 5 Outcome 3 03-03 Benchmarking data X X 03-04 Customer satisfaction data X X 03-06 Process performance information X X X X X X MAN.6 Measurement Outcome 2 Outcome 1"
      },
      {
        "id": "BP6",
        "text": "MAN.6.BP6: Use metrics for decision-making. Make accessible and use information from collected metrics and analysis results for any decision-making process for which it is relevant. Output Information Items 07-51 Measurement result X 15-51 Analysis results X X Base Practices BP1: Identify information needs X BP2: Specify metrics X BP3: Collect and store metrics X BP4: Analyze collected metrics X X X X BP5: Communicate measurement information X BP6: Use metrics for decision-making X 4.10. Process improvement process group (PIM)",
