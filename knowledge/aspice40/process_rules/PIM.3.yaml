  "pam": {
    "purpose": "The purpose is to continually improve the organization’s effectiveness and efficiency through the processes used and ensure alignment of the processes with the business needs.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Commitment is established to provide resources to sustain improvement measures."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Issues arising from the organization's internal or external environment are identified as improvement opportunities and justified as reasons for change."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Analysis of the current status of the existing process is performed."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Improvement goals are identified and prioritized, and consequent changes to the process are defined, documented and implemented."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) The effects of process implementation are monitored, measured and confirmed against the identified improvement goals."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Knowledge gained from the improvement is communicated within the organization."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "PIM.3.BP1: Establish commitment. Establish commitment to support the process improvement staff, to provide resources and further enablers to sustain improvement actions. Note 1: The process improvement process is a generic process, which can be used at all levels (e.g, organizational level, process level, project level, etc.) and which can be used to improve all processes. Note 2: Commitment at all levels of management may support process improvement. Note 3: Enablers for improvement measures may include trainings, methods, infrastructure, etc.",
        "title": "Establish commitment. Establish commitment to support the process improvement staff, to provide resources and further enablers to sustain improvement actions. Note 1: The process improvement process is a generic process, which can be used at all levels (e.g, organizational level, process level, project level, etc.) and which can be used to improve all processes. Note 2: Commitment at all levels of management may support process improvement. Note 3: Enablers for improvement measures may include trainings, methods, infrastructure, etc."
      },
      {
        "id": "BP2",
        "text": "PIM.3.BP2: Identify improvement measures. Identify issues from the analysis of process performance and derive improvement opportunities with justified reasons for change. Note 4: Analysis may include problem report trend analysis (see SUP.9), analysis from Quality Assurance and Verification results and records (see SUP.1), validation results and records, and product quality metrics like defect rate. Note 5: Issues and improvement suggestions may be addressed by the customer. Note 6: Sources for identification of issues may include: process assessment results, audits, customer's satisfaction reports, measurements of organizational effectiveness/efficiency, costs of quality.",
        "title": "Identify improvement measures. Identify issues from the analysis of process performance and derive improvement opportunities with justified reasons for change. Note 4: Analysis may include problem report trend analysis (see SUP.9), analysis from Quality Assurance and Verification results and records (see SUP.1), validation results and records, and product quality metrics like defect rate. Note 5: Issues and improvement suggestions may be addressed by the customer. Note 6: Sources for identification of issues may include: process assessment results, audits, customer's satisfaction reports, measurements of organizational effectiveness/efficiency, costs of quality."
      },
      {
        "id": "BP3",
        "text": "PIM.3.BP3: Establish process improvement goals. Analyze the current status of the existing processes and establish improvement goals. Note 7: The current status of processes may be determined by process assessment.",
        "title": "Establish process improvement goals. Analyze the current status of the existing processes and establish improvement goals. Note 7: The current status of processes may be determined by process assessment."
      },
      {
        "id": "BP4",
        "text": "PIM.3.BP4: Prioritize improvements. Prioritize the improvement goals and improvement measures.",
        "title": "Prioritize improvements. Prioritize the improvement goals and improvement measures."
      },
      {
        "id": "BP5",
        "text": "PIM.3.BP5: Define process improvement measures. Process improvement measures are defined. Note 8: Improvements may be documented in incremental steps.",
        "title": "Define process improvement measures. Process improvement measures are defined. Note 8: Improvements may be documented in incremental steps."
      },
      {
        "id": "BP6",
        "text": "PIM.3.BP6: Implement process improvement measures. Implement and apply the improvements to the processes. Update the Process documentation and train people as needed. Note 9: Process application can be supported by establishing policies, adequate process infrastructure, process training, process coaching and tailoring processes to local needs. Note 10: Improvements may be piloted before roll out within the organization.",
        "title": "Implement process improvement measures. Implement and apply the improvements to the processes. Update the Process documentation and train people as needed. Note 9: Process application can be supported by establishing policies, adequate process infrastructure, process training, process coaching and tailoring processes to local needs. Note 10: Improvements may be piloted before roll out within the organization."
      },
      {
        "id": "BP7",
        "text": "PIM.3.BP7: Confirm process improvement. The effects of process implementation are monitored and measured, and the achievement of defined improvement goals is confirmed. Outcome 6 Outcome 5 Outcome 4 Outcome 3 PIM.3 Process Improvement Outcome 2 Outcome 1",
        "title": "Confirm process improvement. The effects of process implementation are monitored and measured, and the achievement of defined improvement goals is confirmed. Outcome 6 Outcome 5 Outcome 4 Outcome 3 PIM.3 Process Improvement Outcome 2 Outcome 1"
      },
      {
        "id": "BP8",
