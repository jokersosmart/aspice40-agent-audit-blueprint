  "pam": {
    "purpose": "The purpose is to establish a software detailed design, comprising static and dynamic aspects, consistent with the software architecture, and to construct software units consistent with the software detailed design.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A detailed design is specified including static and dynamic aspects."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Software units as specified in the software detailed design are produced."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Consistency and bidirectional traceability are established between software detailed design and software architecture; and consistency and bidirectional traceability are established between source code and software detailed design; and consistency and bidirectional traceability are established between the software detailed design and the software requirements."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) The source code and the agreed software detailed design are communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SWE.3.BP1: Specify the static aspects of the detailed design. For each software component specify the behavior of its software units, their static structure and relationships, their interfaces including • valid data value ranges for inputs and outputs (from the application domain perspective), and • physical or measurement units applicable to inputs and outputs (from the application domain perspective). Note 1: The boundary of a software unit is independent from the software unit’s representation in the source code, code file structure, or model-based implementation, respectively. It is rather driven by the semantics of the application domain perspective. Therefore, a software unit may be, at the code level, represented by a single subroutine or a set of subroutines. Note 2: Examples of valid data value ranges with applicable physical units from the application domain perspective are ‘0..200 [m/s]’, ‘0..3.8 [A]’ or ‘1..100 [N]’. For mapping such application domain value ranges to programming language-level data types (such as unsigned Integer with a value range of 0..65535) refer to BP2. Note 3: Examples of a measurement unit are ‘%’ or ‘‰’. Note 4: A counter is an example of a parameter, or a return value, to which neither a physical nor a measurement unit is applicable. Note 5: The hardware-software-interface (HSI) definition puts in context the hardware design and therefore is an aspect of system design (SYS.3).",
        "title": "Specify the static aspects of the detailed design. For each software component specify the behavior of its software units, their static structure and relationships, their interfaces including • valid data value ranges for inputs and outputs (from the application domain perspective), and • physical or measurement units applicable to inputs and outputs (from the application domain perspective). Note 1: The boundary of a software unit is independent from the software unit’s representation in the source code, code file structure, or model-based implementation, respectively. It is rather driven by the semantics of the application domain perspective. Therefore, a software unit may be, at the code level, represented by a single subroutine or a set of subroutines. Note 2: Examples of valid data value ranges with applicable physical units from the application domain perspective are ‘0..200 [m/s]’, ‘0..3.8 [A]’ or ‘1..100 [N]’. For mapping such application domain value ranges to programming language-level data types (such as unsigned Integer with a value range of 0..65535) refer to BP2. Note 3: Examples of a measurement unit are ‘%’ or ‘‰’. Note 4: A counter is an example of a parameter, or a return value, to which neither a physical nor a measurement unit is applicable. Note 5: The hardware-software-interface (HSI) definition puts in context the hardware design and therefore is an aspect of system design (SYS.3)."
      },
      {
        "id": "BP2",
        "text": "SWE.3.BP2: Specify dynamic aspects of the detailed design. Specify and document the dynamic aspects of the detailed design with respect to the software architecture, including the interactions between relevant software units to fulfill the component’s dynamic behavior. Note 6: Examples for behavioral descriptions are natural language or semi-formal notation (e.g, SysML, UML).",
        "title": "Specify dynamic aspects of the detailed design. Specify and document the dynamic aspects of the detailed design with respect to the software architecture, including the interactions between relevant software units to fulfill the component’s dynamic behavior. Note 6: Examples for behavioral descriptions are natural language or semi-formal notation (e.g, SysML, UML)."
      },
      {
        "id": "BP3",
        "text": "SWE.3.BP3: Develop software units. Develop and document the software units consistent with the detailed design, and according to coding principles. Note 7: Examples for coding principles at capability level 1 are not to use implicit type conversions, only one entry and one exit point in subroutines, and range checks (design-by-contract, defensive programming). Further examples see e.g, ISO 26262-6 clause 8.4.5 together with table 6.",
        "title": "Develop software units. Develop and document the software units consistent with the detailed design, and according to coding principles. Note 7: Examples for coding principles at capability level 1 are not to use implicit type conversions, only one entry and one exit point in subroutines, and range checks (design-by-contract, defensive programming). Further examples see e.g, ISO 26262-6 clause 8.4.5 together with table 6."
      },
      {
        "id": "BP4",
        "text": "SWE.3.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the software detailed design and the software architecture. Ensure consistency and establish bidirectional traceability between the developed software units and the software detailed design. Ensure consistency and establish traceability between the software detailed design and the software requirements. Note 8: Redundancy should be avoided by establishing a combination of these approaches. Note 9: Examples for tracing a software unit in the detailed design to a software requirement directly are communication matrices or basis software aspects such as a list of diagnosis identifiers inherent in an Autosar configuration. Note 10: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 4 Outcome 3 Outcome 2 SWE.3 Software Detailed Design and Unit Construction Outcome 1",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between the software detailed design and the software architecture. Ensure consistency and establish bidirectional traceability between the developed software units and the software detailed design. Ensure consistency and establish traceability between the software detailed design and the software requirements. Note 8: Redundancy should be avoided by establishing a combination of these approaches. Note 9: Examples for tracing a software unit in the detailed design to a software requirement directly are communication matrices or basis software aspects such as a list of diagnosis identifiers inherent in an Autosar configuration. Note 10: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other. Outcome 4 Outcome 3 Outcome 2 SWE.3 Software Detailed Design and Unit Construction Outcome 1"
      },
      {
        "id": "BP5",
        "text": "SWE.3.BP5: Communicate agreed software detailed design and developed software units. Communicate the agreed software detailed design and developed software units to all affected parties. Output Information Items 04-05 Software Detailed Design X 11-05 Software Unit X X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify the static aspects of the detailed design X BP2: Specify the dynamic aspects of the detailed design X BP3: Develop software units X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed software detailed design and developed software units X",
        "title": "Communicate agreed software detailed design and developed software units. Communicate the agreed software detailed design and developed software units to all affected parties. Output Information Items 04-05 Software Detailed Design X 11-05 Software Unit X X 13-51 Consistency Evidence X 13-52 Communication Evidence X Base Practices BP1: Specify the static aspects of the detailed design X BP2: Specify the dynamic aspects of the detailed design X BP3: Develop software units X BP4: Ensure consistency and establish bidirectional traceability X BP5: Communicate agreed software detailed design and developed software units X"
      }
    ]
