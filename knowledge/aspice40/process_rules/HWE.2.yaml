  "pam": {
    "purpose": "The purpose is to provide an analyzed design, including dynamic aspects, that is consistent with the hardware requirements and suitable for manufacturing, and to derive production-relevant data.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) A hardware architecture and hardware detailed design is developed that identifies the elements of the hardware and describes their behavior as well as their interfaces, and the dynamic interactions of the hardware elements."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) The hardware architecture and the hardware detailed design is analyzed, and special characteristics are identified."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) Consistency and bidirectional traceability are established between hardware requirements and hardware design."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Hardware production data is derived from the hardware detailed design and communicated to all affected parties."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Information for production test is derived from the hardware detailed design and communicated to all affected parties."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) The hardware architecture and hardware detailed design and the special characteristics are agreed and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "HWE.2.BP1: Specify the hardware architecture. Develop the hardware architecture that identifies the hardware components. Document the rationale for the defined hardware architecture. Note 1: Examples for aspects reflected in the hardware architecture are ground concept, supply concept, EMC concept. Note 2: Examples for a design rationale can be implied by the reuse of a standard hardware, platform, or product line, respectively, or by a make-or-buy decision, or found in an evolutionary way.",
        "title": "Specify the hardware architecture. Develop the hardware architecture that identifies the hardware components. Document the rationale for the defined hardware architecture. Note 1: Examples for aspects reflected in the hardware architecture are ground concept, supply concept, EMC concept. Note 2: Examples for a design rationale can be implied by the reuse of a standard hardware, platform, or product line, respectively, or by a make-or-buy decision, or found in an evolutionary way."
      },
      {
        "id": "BP2",
        "text": "HWE.2.BP2: Specify the hardware detailed design. Based on components identified in the hardware architecture, specify the detailed design description and the schematics for the intended hardware variants, including the interfaces between the hardware elements. Derive the hardware layout, the hardware bill of materials, and the production data. Note 3: The identification of hardware parts and their suppliers in the hardware bill of materials may be subject to a pre-defined repository (see also IATF 16949:2016, clause 8.4.1.2.). Note 4: Hardware detailed design may be subject to constraints such as availability of hardware parts on the market, hardware design rules, layout rules, creepage and clearance distances, compliance of HW parts with industry standards such as AEC-Q, REACH.",
        "title": "Specify the hardware detailed design. Based on components identified in the hardware architecture, specify the detailed design description and the schematics for the intended hardware variants, including the interfaces between the hardware elements. Derive the hardware layout, the hardware bill of materials, and the production data. Note 3: The identification of hardware parts and their suppliers in the hardware bill of materials may be subject to a pre-defined repository (see also IATF 16949:2016, clause 8.4.1.2.). Note 4: Hardware detailed design may be subject to constraints such as availability of hardware parts on the market, hardware design rules, layout rules, creepage and clearance distances, compliance of HW parts with industry standards such as AEC-Q, REACH."
      },
      {
        "id": "BP3",
        "text": "HWE.2.BP3: Specify dynamic aspects. Evaluate and document the dynamic behavior of the relevant hardware elements and the interaction between them. Note 5: Not all hardware elements have dynamic behavior that needs to be described.",
        "title": "Specify dynamic aspects. Evaluate and document the dynamic behavior of the relevant hardware elements and the interaction between them. Note 5: Not all hardware elements have dynamic behavior that needs to be described."
      },
      {
        "id": "BP4",
        "text": "HWE.2.BP4: Analyze the hardware architecture and the hardware detailed design. Analyze the hardware architecture and hardware detailed design regarding relevant technical aspects, and support project management regarding project estimates. Identify special characteristics. Note 6: Examples for technical aspects are manufacturability for production, suitability of pre-existing hardware components to be reused, or availability of hardware elements. Note 7: Examples of methods suitable for analyzing technical aspects are simulations, calculations, quantitative or qualitative analyses such as FMEA.",
        "title": "Analyze the hardware architecture and the hardware detailed design. Analyze the hardware architecture and hardware detailed design regarding relevant technical aspects, and support project management regarding project estimates. Identify special characteristics. Note 6: Examples for technical aspects are manufacturability for production, suitability of pre-existing hardware components to be reused, or availability of hardware elements. Note 7: Examples of methods suitable for analyzing technical aspects are simulations, calculations, quantitative or qualitative analyses such as FMEA."
      },
      {
        "id": "BP5",
        "text": "HWE.2.BP5: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish traceability between hardware elements and hardware requirements. Ensure consistency and establish traceability between the hardware detailed design and components of the hardware architecture. Note 8: There may be non-functional hardware requirements that the hardware design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 9: Bidirectional traceability further supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g, the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish traceability between hardware elements and hardware requirements. Ensure consistency and establish traceability between the hardware detailed design and components of the hardware architecture. Note 8: There may be non-functional hardware requirements that the hardware design does not trace to. Examples are development process requirements. Such requirements are still subject to verification. Note 9: Bidirectional traceability further supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g, the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP6",
        "text": "HWE.2.BP6: Communicate agreed hardware architecture and hardware detailed design. Communicate the agreed hardware architecture and the hardware detailed design, including the special characteristics and relevant production data, to all affected parties. Outcome 6 Outcome 5 Outcome 4 Outcome 3 Outcome 2 Outcome 1 HWE.2 Hardware Design Output Information Items 04-52 Hardware Architecture X 04-53 Hardware Detailed Design X 15-51 Analysis Results X 13-51 Consistency Evidence X 17-57 Special Characteristics X 13-52 Communication Evidence X 04-54 Hardware Schematics X X X 14-54 Hardware Bill of Materials X X X 04-55 Hardware Layout X X X 03-54 Hardware Production Data X X X 04-56 Hardware Element Interface X Base Practices BP1: Specify the hardware architecture X X X BP2: Specify the hardware detailed design X X X BP3: Specify dynamic aspects X X X BP4: Analyze the hardware architecture and the hardware detailed design BP5: Ensure consistency and establish bidirectional traceability BP7: Communicate agreed hardware architecture and hardware detailed design X X X",
        "title": "Communicate agreed hardware architecture and hardware detailed design. Communicate the agreed hardware architecture and the hardware detailed design, including the special characteristics and relevant production data, to all affected parties. Outcome 6 Outcome 5 Outcome 4 Outcome 3 Outcome 2 Outcome 1 HWE.2 Hardware Design Output Information Items 04-52 Hardware Architecture X 04-53 Hardware Detailed Design X 15-51 Analysis Results X 13-51 Consistency Evidence X 17-57 Special Characteristics X 13-52 Communication Evidence X 04-54 Hardware Schematics X X X 14-54 Hardware Bill of Materials X X X 04-55 Hardware Layout X X X 03-54 Hardware Production Data X X X 04-56 Hardware Element Interface X Base Practices BP1: Specify the hardware architecture X X X BP2: Specify the hardware detailed design X X X BP3: Specify dynamic aspects X X X BP4: Analyze the hardware architecture and the hardware detailed design BP5: Ensure consistency and establish bidirectional traceability BP7: Communicate agreed hardware architecture and hardware detailed design X X X"
