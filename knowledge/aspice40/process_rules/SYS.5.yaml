  "pam": {
    "purpose": "The purpose is to ensure that the system is verified to be consistent with the system requirements.",
    "outcomes": [
      {
        "id": "OUTCOME.1",
        "text": "1) Verification measures are specified for system verification of the system based on the system requirements."
      },
      {
        "id": "OUTCOME.2",
        "text": "2) Verification measures are selected according to the release scope considering criteria, including criteria for regression verification."
      },
      {
        "id": "OUTCOME.3",
        "text": "3) The integrated system is verified using the selected verification measures and the results of system verification are recorded."
      },
      {
        "id": "OUTCOME.4",
        "text": "4) Consistency and bidirectional traceability are established between verification measures and system requirements."
      },
      {
        "id": "OUTCOME.5",
        "text": "5) Bidirectional traceability is established between verification results and verification measures."
      },
      {
        "id": "OUTCOME.6",
        "text": "6) Verification results are summarized and communicated to all affected parties."
      }
    ],
    "base_practices": [
      {
        "id": "BP1",
        "text": "SYS.5.BP1: Specify verification measures for system verification. Specify the verification measures for system verification suitable to provide evidence for compliance with the functional and non-functional information in the system requirements, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification measures, and • the required verification infrastructure and environment setup. Note 1: The system verification measures may cover aspects such as thermal, environmental, robustness/lifetime, and EMC.",
        "title": "Specify verification measures for system verification. Specify the verification measures for system verification suitable to provide evidence for compliance with the functional and non-functional information in the system requirements, including • techniques for the verification measures, • pass/fail criteria for verification measures, • a definition of entry and exit criteria for the verification measures, • necessary sequence of verification measures, and • the required verification infrastructure and environment setup. Note 1: The system verification measures may cover aspects such as thermal, environmental, robustness/lifetime, and EMC."
      },
      {
        "id": "BP2",
        "text": "SYS.5.BP2: Select verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for criteria for selection can be prioritization of requirements, the need for regression verification (due to e.g., changes to the system requirements), the intended use of the delivered product release (test bench, test track, public road etc.)",
        "title": "Select verification measures. Document the selection of verification measures considering selection criteria including criteria for regression verification. The selection of verification measures shall have sufficient coverage according to the release scope. Note 2: Examples for criteria for selection can be prioritization of requirements, the need for regression verification (due to e.g., changes to the system requirements), the intended use of the delivered product release (test bench, test track, public road etc.)"
      },
      {
        "id": "BP3",
        "text": "SYS.5.BP3: Perform verification of the integrated system. Perform the verification of the integrated system using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling verification results that deviate from expected results",
        "title": "Perform verification of the integrated system. Perform the verification of the integrated system using the selected verification measures. Record the verification results including pass/fail status and corresponding verification measure data. Note 3: See SUP.9 for handling verification results that deviate from expected results"
      },
      {
        "id": "BP4",
        "text": "SYS.5.BP4: Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and system requirements. Establish bidirectional traceability between verification results and verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.",
        "title": "Ensure consistency and establish bidirectional traceability. Ensure consistency and establish bidirectional traceability between verification measures and system requirements. Establish bidirectional traceability between verification results and verification measures. Note 4: Bidirectional traceability supports consistency, and facilitates impact analysis of change requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other."
      },
      {
        "id": "BP5",
        "text": "SYS.5.BP5: Summarize and communicate results. Summarize the system verification results and communicate them to all affected parties. Outcome 5 X X Outcome 6 Outcome 4 Output Information Item 08-60 Verification Measure 03-50 Verification Measure Data 08-58 Verification Measure Selection Set 15-52 Verification Results 13-51 Consistency Evidence 13-52 Communication Evidence Base Practices BP1: Specify verification measures for system verification BP2: Select verification measures BP3: Perform verification of the integrated system BP4: Ensure consistency and establish bidirectional traceability. BP5: Summarize and communicate results Outcome 3 SYS.5 System Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. X X X X X X X X X X X 4.4. Software engineering process group (SWE)",
        "title": "Summarize and communicate results. Summarize the system verification results and communicate them to all affected parties. Outcome 5 X X Outcome 6 Outcome 4 Output Information Item 08-60 Verification Measure 03-50 Verification Measure Data 08-58 Verification Measure Selection Set 15-52 Verification Results 13-51 Consistency Evidence 13-52 Communication Evidence Base Practices BP1: Specify verification measures for system verification BP2: Select verification measures BP3: Perform verification of the integrated system BP4: Ensure consistency and establish bidirectional traceability. BP5: Summarize and communicate results Outcome 3 SYS.5 System Verification Outcome 2 Outcome 1 Note 5: Providing all necessary information from the test case execution in a summary enables other parties to judge the consequences. X X X X X X X X X X X 4.4. Software engineering process group (SWE)"
      }
