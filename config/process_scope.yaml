schema_version: "1.0"
profile_name: "SM2514 initial audit scope"
project_id: "SM2514_ISO26262"
project_root: ".."
assessment_context:
  assessment_type: "internal_self_assessment_rehearsal"
  assessment_class: "documentation_and_evidence_readiness"
  customer_or_oem: "TO_BE_CONFIRMED"
  target_capability_profile: "TO_BE_CONFIRMED_BY_LEAD_ASSESSOR"
  rating_method: "lead_assessor_to_confirm"
  product_scope: "SM2514 SSD Controller HW IP and firmware evidence"
  lifecycle_scope: "system_requirements_to_hw_ip_design_verification_and_owner_signoff"
  release_or_baseline: "WORKING_TREE_BASELINE"
  scope_owner: "PROJECT_SCOPE_OWNER"
  qa_reviewer: "QA_REVIEWER"
  lead_assessor: "LEAD_ASSESSOR"
  evidence_policy: "metadata_and_hashes_only_in_public_blueprint"

# This is an initial adoption profile, not a formal assessment-scope decision.
# Every status still requires approval by the project scope owner and, where
# applicable, QA / Lead Assessor. Missing evidence must never be used as a
# reason to silently mark a Process not_in_scope.
# Allowed values: in_scope, conditional, not_in_scope, out_of_scope, unknown.
process_scope:
  ACQ.4: {status: conditional, rationale: "Confirm external IP, EDA, NAND, PHY and supplier responsibilities", approved_by: "PROJECT_SCOPE_OWNER"}
  SPL.2: {status: conditional, rationale: "Release package and release approval are outside the current HW IP authoring focus", approved_by: "PROJECT_SCOPE_OWNER"}
  SYS.1: {status: conditional, rationale: "Stakeholder and intended-use evidence is referenced but not the primary current work product", approved_by: "PROJECT_SCOPE_OWNER"}
  SYS.2: {status: in_scope, rationale: "SM2514 system requirements and allocation evidence exist under the AiWorkSpace SYS2 workspace", approved_by: "PROJECT_SCOPE_OWNER"}
  SYS.3: {status: in_scope, rationale: "HW IP specifications, architecture attributes and interface allocations are current project work products", approved_by: "PROJECT_SCOPE_OWNER"}
  SYS.4: {status: conditional, rationale: "System integration evidence must be confirmed before expanding beyond document readiness", approved_by: "PROJECT_SCOPE_OWNER"}
  SYS.5: {status: conditional, rationale: "System verification evidence must be confirmed before formal use", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.1: {status: conditional, rationale: "Firmware requirement coverage is present only for selected workspaces and requires scope confirmation", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.2: {status: conditional, rationale: "Firmware architecture evidence is present for selected components and requires scope confirmation", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.3: {status: conditional, rationale: "Detailed-design and construction evidence is not uniformly represented across the current workspace", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.4: {status: in_scope, rationale: "SWE.4 unit-test specifications and traceability blocks are existing evidence types", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.5: {status: conditional, rationale: "Component and integration verification evidence requires a project-level baseline", approved_by: "PROJECT_SCOPE_OWNER"}
  SWE.6: {status: conditional, rationale: "Software verification evidence requires a project-level baseline", approved_by: "PROJECT_SCOPE_OWNER"}
  VAL.1: {status: conditional, rationale: "Target-environment validation is not the first adoption slice", approved_by: "PROJECT_SCOPE_OWNER"}
  MLE.1: {status: conditional, rationale: "No ML artifact is assumed; C05 must confirm scope before any N/A decision", approved_by: "PROJECT_SCOPE_OWNER"}
  MLE.2: {status: conditional, rationale: "No ML artifact is assumed; C05 must confirm scope before any N/A decision", approved_by: "PROJECT_SCOPE_OWNER"}
  MLE.3: {status: conditional, rationale: "No ML artifact is assumed; C05 must confirm scope before any N/A decision", approved_by: "PROJECT_SCOPE_OWNER"}
  MLE.4: {status: conditional, rationale: "No ML artifact is assumed; C05 must confirm scope before any N/A decision", approved_by: "PROJECT_SCOPE_OWNER"}
  HWE.1: {status: in_scope, rationale: "HW requirements and IP specification evidence are core current work products", approved_by: "PROJECT_SCOPE_OWNER"}
  HWE.2: {status: in_scope, rationale: "HW IP architecture, design, flow and safety-description evidence are core current work products", approved_by: "PROJECT_SCOPE_OWNER"}
  HWE.3: {status: in_scope, rationale: "Hardware design verification is a required downstream evidence gate for the HW IP flow", approved_by: "PROJECT_SCOPE_OWNER"}
  HWE.4: {status: in_scope, rationale: "Hardware requirements verification and traceability are required for the current IP specification workflow", approved_by: "PROJECT_SCOPE_OWNER"}
  SUP.1: {status: conditional, rationale: "Independent QA and process-assurance ownership must be confirmed for the selected evidence set", approved_by: "PROJECT_SCOPE_OWNER"}
  SUP.8: {status: in_scope, rationale: "Git baselines, Stage 1 immutability and configuration-controlled work products are explicit project controls", approved_by: "PROJECT_SCOPE_OWNER"}
  SUP.9: {status: conditional, rationale: "Problem-resolution records require a controlled project source before audit use", approved_by: "PROJECT_SCOPE_OWNER"}
  SUP.10: {status: in_scope, rationale: "Change impact, task tracking and review gates are required to protect staged flow work products", approved_by: "PROJECT_SCOPE_OWNER"}
  SUP.11: {status: conditional, rationale: "No ML data is assumed; C05 must confirm scope before any N/A decision", approved_by: "PROJECT_SCOPE_OWNER"}
  MAN.3: {status: conditional, rationale: "Project-management evidence is outside the first HW IP evidence slice", approved_by: "PROJECT_SCOPE_OWNER"}
  MAN.5: {status: conditional, rationale: "Risk evidence is useful but requires an approved project risk source", approved_by: "PROJECT_SCOPE_OWNER"}
  MAN.6: {status: conditional, rationale: "Measurement evidence requires agreed project metrics and baselines", approved_by: "PROJECT_SCOPE_OWNER"}
  PIM.3: {status: conditional, rationale: "Process-improvement evidence will be added after the first audit rehearsal", approved_by: "PROJECT_SCOPE_OWNER"}
  REU.2: {status: conditional, rationale: "Reuse of IP, EDA, design or software products requires explicit responsibility mapping", approved_by: "PROJECT_SCOPE_OWNER"}

tailoring_rules:
  - rule_id: TAILOR-SM2514-001
    statement: "The first adoption wave covers evidence readiness for SYS.2/SYS.3, HWE.1-HWE.4, SWE.4, SUP.8 and SUP.10; expansion requires a scope record and review."
    owner: "PROJECT_SCOPE_OWNER"
    status: draft
  - rule_id: TAILOR-SM2514-002
    statement: "Stage 1 Golden files are immutable reference evidence. The audit layer may hash and reference them, but must not rewrite or regenerate them."
    owner: "PROJECT_SCOPE_OWNER"
    status: draft
  - rule_id: TAILOR-SM2514-003
    statement: "Public Blueprint commits may contain schemas, rules, prompts and redacted examples only; project evidence remains in the authorized local repository or evidence store."
    owner: "PROJECT_SCOPE_OWNER"
    status: draft
