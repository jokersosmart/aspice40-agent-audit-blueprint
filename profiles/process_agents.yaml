schema_version: "1.0"
aspice_version: "4.0"
profile_version: "2026.08.24"
engine: "process_auditor_v1"
rulepack_root: "knowledge/aspice40/process_rules"
defaults:
  human_confirmation_required: true
  default_unknown_policy: "insufficient_evidence_is_unknown_until_confirmed"
  default_requirement_types:
    - pam_explicit
    - company_rule
    - customer_specific
    - product_context
    - inference
processes:
  - id: ACQ.4
    name: Supplier Monitoring
    group: ACQ
    scope_default: conditional
    primary_managers: [M14]
    verification_managers: [M11]
    evidence_domains: [supplier_commitment, supplier_progress, supplier_reviews, communication, deviation, risk]
    upstream: [MAN.3, MAN.5]
    downstream: [SPL.2, REU.2, SUP.8]
    rulepack: ACQ.4.yaml
  - id: SPL.2
    name: Product Release
    group: SPL
    scope_default: in_scope
    primary_managers: [M14, M12]
    verification_managers: [M11]
    evidence_domains: [release_content, release_package, release_documentation, approval, delivery, baseline]
    upstream: [SYS.5, SWE.6, HWE.4, VAL.1, SUP.8]
    downstream: []
    rulepack: SPL.2.yaml
  - id: SYS.1
    name: Requirements Elicitation
    group: SYS
    scope_default: in_scope
    primary_managers: [M01]
    verification_managers: [M08]
    evidence_domains: [stakeholder_needs, intended_use, stakeholder_requirements, affected_parties, agreement, communication]
    upstream: [ACQ.4]
    downstream: [SYS.2, SYS.3, VAL.1]
    rulepack: SYS.1.yaml
  - id: SYS.2
    name: System Requirements Analysis
    group: SYS
    scope_default: in_scope
    primary_managers: [M01]
    verification_managers: [M08]
    evidence_domains: [system_requirements, functional_requirements, nonfunctional_requirements, feasibility, prioritization, traceability]
    upstream: [SYS.1]
    downstream: [SYS.3, SWE.1, HWE.1, VAL.1]
    rulepack: SYS.2.yaml
  - id: SYS.3
    name: System Architectural Design
    group: SYS
    scope_default: in_scope
    primary_managers: [M01, M03]
    verification_managers: [M08, M10]
    evidence_domains: [system_architecture, interfaces, system_elements, behavior, resource_constraints, traceability]
    upstream: [SYS.2]
    downstream: [SYS.4, SWE.2, HWE.2, VAL.1]
    rulepack: SYS.3.yaml
  - id: SYS.4
    name: System Integration and Integration Verification
    group: SYS
    scope_default: in_scope
    primary_managers: [M01, M08]
    verification_managers: [M08, M06, M10]
    evidence_domains: [integration_strategy, integration_sequence, integration_measures, integrated_system, results, regression, traceability]
    upstream: [SYS.3, SWE.5, HWE.3]
    downstream: [SYS.5, VAL.1, SPL.2]
