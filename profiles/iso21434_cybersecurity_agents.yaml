standard: ISO21434
edition: "ISO/SAE 21434:2021"
profile_version: "1.0"
common_contract:
  direct_spec_citation_required: true
  citation_fields: [standard_id, edition, clause, provision_id, provision_type, verbatim_text, source_anchor, verbatim_text_sha256, why_this_text_applies, interpretation, human_verification_status]
  provision_types: [requirement, recommendation, permission, work_product]
  missing_source_status: citation_missing
  normative_boundary: "The Agent prepares cybersecurity evidence and findings; it may not declare cybersecurity compliance, accept residual cyber risk, close a major vulnerability, approve a cybersecurity case, or replace an independent cybersecurity assessor."
  required_human_roles: [Cybersecurity_Manager, Security_Architect, Product_Owner, Independent_Security_Reviewer, QA_or_Security_Assessor]
agents:
  - id: CS01
    name: Cybersecurity Scope and Terminology Auditor
    focus: [Clause_1, Clause_2, Clause_3, Clause_4]
    responsibilities: [scope_applicability, item_or_component_boundary, terminology_consistency, normative_reference_dependency, compliance_claim_boundary]
    evidence_domains: [item_definition, component_boundary, cybersecurity_scope, terminology_register, compliance_claim]
    aspice_iso26262_interfaces: [C01, C08, SYS.1, SYS.2, HWE.1, FS01]
    human_gates: [scope_approval, claim_boundary_review]
  - id: CS02
    name: Organizational Cybersecurity Governance Agent
    focus: [Clause_5]
    responsibilities: [cybersecurity_policy, organizational_rules_and_processes, roles_and_responsibilities, cybersecurity_culture, quality_management, tool_management, organizational_audit]
    evidence_domains: [cybersecurity_policy, process_handbook, role_matrix, training_records, tool_register, audit_plan]
    aspice_iso26262_interfaces: [C01, C05, SUP.1, MAN.3, MAN.5, M15]
    human_gates: [policy_approval, resource_commitment, organizational_audit_plan]
  - id: CS03
    name: Project Cybersecurity Management Agent
    focus: [Clause_6]
    responsibilities: [project_cybersecurity_plan, activity_relevance, tailoring, reuse_analysis, out_of_context_component, off_the_shelf_component, cybersecurity_case_decision, assessment_decision]
    evidence_domains: [cybersecurity_plan, tailoring_rationale, reuse_analysis, OTS_analysis, cybersecurity_case, assessment_decision]
    aspice_iso26262_interfaces: [MAN.3, MAN.5, SUP.8, SUP.10, REU.2, FS02]
    human_gates: [project_plan, tailoring, reuse_or_OTS_acceptance, assessment_decision]
  - id: CS04
    name: Distributed Cybersecurity Responsibility Agent
    focus: [Clause_7]
    responsibilities: [customer_supplier_responsibility, RFQ_cybersecurity_requirements, capability_evaluation, cybersecurity_interface_agreement, distributed_work_product_exchange]
    evidence_domains: [RFQ, contract, cybersecurity_interface_agreement, supplier_capability_assessment, responsibility_matrix]
    aspice_iso26262_interfaces: [ACQ.4, SPL.2, SUP.8, SUP.10, M14, FS13]
    human_gates: [supplier_selection, responsibility_agreement, external_commitment]
  - id: CS05
    name: Continual Cybersecurity Monitoring Agent
    focus: [Clause_8_1_to_8_4]
